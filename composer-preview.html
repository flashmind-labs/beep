<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Beep composer preview mock</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #0f1011;
      --surface: #151617;
      --elev: #1c1d1f;
      --border: #2e3033;
      --fg: #e3e4e6;
      --muted: #989da6;
      --link: #a2afff;
      --radius: 6px;
      --mono: ui-monospace, monospace;
      font: 16px/24px system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink); color: var(--fg); }
    main { max-width: 768px; margin-inline: auto; padding: 48px 24px 32px; }
    .turn { margin: 0 0 32px; }
    .turn p { margin: 0; text-wrap: pretty; }
    .turn .request { width: fit-content; margin: 0 0 24px auto; padding: 8px 12px; border-radius: var(--radius); background: var(--elev); }
    .turn .reply { max-width: 540px; }
    code { color: var(--link); font: 12px/16px var(--mono); overflow-wrap: anywhere; }

    .activity {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 4px 12px;
      margin-inline: 8px;
      padding: 4px 8px 4px 12px;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: var(--radius) var(--radius) 0 0;
      background: var(--surface);
      font: 12px/16px var(--mono);
    }
    .running, .preview { display: inline-flex; gap: 8px; align-items: center; }
    .running { color: var(--muted); }
    .spinner { width: 10px; height: 10px; border: 2px solid var(--border); border-bottom-color: var(--link); border-radius: 50%; }
    button { font: inherit; cursor: pointer; }
    .preview {
      min-height: 24px;
      padding: 2px 8px;
      border: 0;
      border-radius: 4px;
      background: #5e6ad225;
      color: var(--link);
    }
    .preview:hover { background: #5e6ad245; }
    .preview:active { transform: translateY(1px); }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .port { color: var(--fg); }
    .external {
      position: relative;
      width: 9px;
      height: 9px;
      margin-right: 2px;
      border: 1px solid currentColor;
      border-top-color: transparent;
      border-radius: 2px;
    }
    .external::before, .external::after { content: ""; position: absolute; }
    .external::before { top: -2px; right: -2px; width: 4px; height: 4px; border-top: 1px solid; border-right: 1px solid; }
    .external::after { top: 0; right: -2px; width: 7px; height: 1px; background: currentColor; transform: rotate(-45deg); }

    .composer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--elev);
    }
    textarea {
      flex: 1 1 168px;
      min-width: 0;
      height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      resize: none;
    }
    textarea::placeholder { color: var(--muted); }
    .attach { color: var(--muted); font-size: 20px; }
    .model { color: var(--muted); font: 12px/16px var(--mono); }

    #forward {
      inset: auto;
      position: absolute;
      position-anchor: --preview;
      top: anchor(bottom);
      right: anchor(right);
      max-width: calc(100% - 32px);
      margin: 8px 0 0;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--elev);
      color: var(--fg);
      box-shadow: 0 8px 24px #0008;
      font-size: 14px;
    }
    #forward p { margin: 0; }
    .preview { anchor-name: --preview; }
    @supports not (position-anchor: --preview) {
      #forward { inset: 0; position: fixed; margin: auto; }
    }
  </style>
</head>
<body>
  <main aria-label="Beep session mock">
    <section class="turn" aria-label="Conversation">
      <p class="request">Start the site locally so I can check it.</p>
      <p class="reply">The site is serving at <code>https://localhost:8443/</code> on the session’s machine.</p>
    </section>
    <section aria-label="Message composer">
      <div class="activity">
        <span class="running"><span class="spinner" aria-hidden="true"></span>1 command running</span>
        <button class="preview" type="button" popovertarget="forward" title="Open https://localhost:8443/">
          <span class="external" aria-hidden="true"></span>Open preview <span class="port">:8443</span>
        </button>
      </div>
      <div class="composer">
        <span class="attach" aria-hidden="true">+</span>
        <textarea rows="1" aria-label="Message Claude Code" placeholder="Message Claude Code"></textarea>
        <span class="model">Claude Code</span>
      </div>
      <div id="forward" popover>
        <p>Beep would forward the port and open</p>
        <code>https://localhost:8443/</code>
      </div>
    </section>
  </main>
</body>
</html>

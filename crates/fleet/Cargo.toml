[package]
name = "beep-fleet"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
beep-mesh = { path = "../mesh" }
beep-projects = { path = "../projects" }
beep-proto = { path = "../proto", features = ["https"] }
blake3 = "1"
chrono = "0.4"
fastrand = "2"
futures = "0.3"
# Lean for the phone; a node and the server turn on the defaults.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmp-serde = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
beep-mesh = { path = "../mesh" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "net", "rt-multi-thread", "time"] }
async-trait = "0.1"
log = "0.4"
iroh-tickets = "1"
serde_bytes = "0.11"

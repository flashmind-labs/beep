[package]
name = "beep-report"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
beep-mesh = { path = "../mesh" }
beep-proto = { path = "../proto" }
chrono = "0.4"
iroh = "1.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

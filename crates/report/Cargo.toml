[package]
name = "beep-report"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
beep-mesh = { path = "../mesh" }
beep-proto = { path = "../proto", features = ["https"] }
chrono = "0.4"
hex = "0.4"
# Lean for the phone; a node and the server turn on the defaults.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
regex = "1"
reqwest = { version = "0.13.5", default-features = false }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros", "process", "io-util"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util", "net", "io-util"] }

[package]
name = "beep-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
beep-fleet = { path = "../fleet" }
beep-mesh = { path = "../mesh" }
beep-live = { path = "../live" }
futures = "0.3"
beep-proto = { path = "../proto", features = ["client", "uniffi"] }
iroh = "1.3"
log = "0.4"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uniffi = { version = "0.32", features = ["tokio"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
iroh-tickets = "1"

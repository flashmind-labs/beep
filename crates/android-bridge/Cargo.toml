[package]
name = "beep-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bytes = "1"
iroh = "1.3"
jni = "0.21"
beep-quic-client = { path = "../quic-client" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-util = "0.7"

[package]
name = "beep-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
anyhow = "1"
beep-proto = { path = "../proto", features = ["uniffi"] }
iroh = "1.3"
secrecy = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uniffi = { version = "0.32", features = ["tokio"] }
uuid = "1"

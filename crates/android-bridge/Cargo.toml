[package]
name = "neobeep-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bytes = "1"
jni = "0.21"
neobeep-quic-client = { path = "../quic-client" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-util = "0.7"

[package]
name = "beep-node"
version = "0.1.10"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
default = ["cli"]
# The command line; a host that embeds the node, such as the Mac app, leaves it out.
cli = ["dep:clap", "dep:logforth"]

[[bin]]
name = "beep-node"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
agent-client-protocol = "3.6"
anyhow = "1"
bao-tree = "0.17"
base64 = "0.22"
beep-proto = { path = "../proto" }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"], optional = true }
dirs = "7"
futures = "0.3"
ignore = "0.4"
iroh = "1.3"
iroh-blobs = { version = "0.104", default-features = false, features = ["fs-store"] }
log = "0.4"
logforth = { version = "0.30", features = ["starter-log"], optional = true }
notify = "8"
rmp-serde = "1"
# flsh keeps its sessions in SQLite; the same version flashmind uses.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "signal", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
which = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

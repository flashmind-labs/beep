[package]
name = "beep-node"
version = "0.6.30"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99"
publish = false

[features]
default = ["cli"]
# Everything that runs on a machine: agents, terminals, file sync and
# transfers, the machine's services. The phone app leaves it out and keeps the
# link types it shares with the mesh.
host = [
    "dep:strum",
    "dep:tokio-stream",
    "dep:agent-client-protocol",
    "dep:bao-tree",
    "dep:base64",
    "dep:beep-mesh",
    "beep-mesh/thumbs",
    "dep:beep-projects",
    "dep:beep-report",
    "dep:blake3",
    "dep:chrono",
    "dep:dirs",
    "dep:dunce",
    "dep:flashmind-tools",
    "dep:flashmind-types",
    "dep:futures",
    "dep:gix",
    "dep:hex",
    "dep:humantime",
    "dep:hyper-util",
    "dep:image",
    "dep:ignore",
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:iroh-tickets",
    "dep:iroh-metrics",
    "dep:jsonschema",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:log",
    "dep:notify",
    "dep:portable-pty",
    "dep:prost",
    "dep:protox",
    "dep:rand",
    "dep:regex",
    "dep:reqwest",
    "dep:rmp",
    "dep:rmp-serde",
    "dep:rust-ini",
    "dep:roxmltree",
    "dep:rusqlite",
    "dep:secrecy",
    "dep:serde",
    "dep:serde_bytes",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:tokio-util",
    "dep:tracing",
    "dep:tempfile",
    "dep:toml",
    "dep:toml_edit",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:tower",
    "dep:uuid",
    "dep:which",
    "dep:libc",
    "dep:rustix",
    "dep:windows-sys",
    "beep-proto/logging",
    "beep-proto/https",
    "beep-proto/http2",
]
# The command line; a host that embeds the node, such as the Mac app, leaves it out.
# `beep-node update` comes with it, with what it downloads and unpacks with.
cli = [
    "host",
    "dep:clap",
    "dep:flate2",
    "dep:tar",
    "dep:thiserror",
    "dep:zip",
]

[[bin]]
name = "beep-node"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
agent-client-protocol = { version = "5.2", features = ["unstable_end_turn_token_usage", "unstable_protocol_v2"], optional = true }
anyhow = "1"
bao-tree = { version = "0.17", optional = true }
base64 = { version = "0.23", optional = true }
beep-mesh = { path = "../mesh", optional = true }
# Reads CI runs as the desktop does.
beep-projects = { path = "../projects", optional = true }
beep-proto = { path = "../proto" }
beep-report = { path = "../report", optional = true }
blake3 = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
dirs = { version = "7", optional = true }
# `fs::canonicalize` without the verbatim prefix Windows programs refuse.
dunce = { version = "1", optional = true }
fastrand = "2"
flate2 = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
gix = { version = "0.90", default-features = false, features = ["revision", "sha1", "sha256"], optional = true }
hex = { version = "0.4", optional = true }
humantime = { version = "2", optional = true }
ignore = { version = "0.4", optional = true }
# Device frames: the emulator's pixels encoded, the simulator's measured.
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
# Port mapping and metrics: a node is reached from outside.
iroh = { version = "1.4.1", optional = true }
iroh-blobs = { version = "0.104", default-features = false, features = ["fs-store"], optional = true }
iroh-tickets = { version = "1", optional = true }
iroh-metrics = { version = "1", optional = true }
jsonschema = { version = "0.61.2", default-features = false, optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true }
log = { version = "0.4", optional = true }
notify = { version = "8", optional = true }
# Interactive terminals: a pseudo-terminal on Unix, ConPTY on Windows.
portable-pty = { version = "0.9", optional = true }
# The Android emulator's and idb's gRPC services, client side only.
prost = { version = "0.14", optional = true }
rand = { version = "0.10", optional = true }
regex = { version = "1", optional = true }
# `beep-node update` downloads releases, and the CI watch asks GitHub, with
# the client setup from `beep_proto::https`.
reqwest = { version = "0.13.5", default-features = false, optional = true }
rmp = { version = "0.8", optional = true }
rmp-serde = { version = "1", optional = true }
# The Android emulator's discovery files.
rust-ini = { version = "0.21", optional = true }
roxmltree = { version = "0.21", optional = true }
# flsh keeps its sessions in SQLite.
rusqlite = { version = "0.42", features = ["bundled"], optional = true }
secrecy = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }
serde_json = { version = "1", optional = true }
# Custom agent frontmatter; the same version the server reads personas with.
serde_yaml = { version = "0.9", optional = true }
sha2 = { version = "0.11", optional = true }
strum = { version = "0.28", features = ["derive"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "signal", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tokio-util = { version = "0.7", features = ["codec", "rt"], optional = true }
tempfile = { version = "3", optional = true }
toml = { version = "1", optional = true }
# Writes Beep's keys into flsh's config.toml, keeping the rest as it was.
toml_edit = { version = "0.25", optional = true }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"], optional = true }
tonic-prost = { version = "0.14", optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
which = { version = "8", optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

# The media and decision tools the MCP server offers from the saved API keys.
flashmind-tools = { version = "0.3.6", default-features = false, features = ["http"], optional = true }
flashmind-types = { version = "0.3.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
rustix = { version = "1", features = ["fs", "process"], optional = true }

# idb_companion listens on a Unix socket.
[target.'cfg(target_os = "macos")'.dependencies]
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
# Compiles the vendored gRPC protos in Rust, with no `protoc` to install.
protox = { version = "0.10", optional = true }
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
# Checks that no process-wide crypto provider gets installed.
rustls = { version = "0.23", default-features = false }
async-trait = "0.1"
tokio = { version = "1", features = ["test-util"] }
# Reads what Beep writes to flsh's config with flsh's own types.
flashmind-types = "0.3.2"

[package]
name = "beep-node"
version = "0.2.11"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
default = ["cli"]
# The command line; a host that embeds the node, such as the Mac app, leaves it out.
# `beep-node update` comes with it, with what it downloads and unpacks with.
cli = [
    "dep:clap",
    "beep-proto/logging",
    "dep:reqwest",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:flate2",
    "dep:tar",
    "dep:thiserror",
    "dep:zip",
]

[[bin]]
name = "beep-node"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
agent-client-protocol = { version = "3.6", features = ["unstable_end_turn_token_usage"] }
anyhow = "1"
bao-tree = "0.17"
base64 = "0.22"
beep-mesh = { path = "../mesh" }
beep-proto = { path = "../proto" }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"], optional = true }
dirs = "7"
fastrand = "2"
flate2 = { version = "1", optional = true }
futures = "0.3"
hex = "0.4"
hmac = "0.13"
ignore = "0.4"
iroh = "1.3"
iroh-blobs = { version = "0.104", default-features = false, features = ["fs-store"] }
iroh-tickets = "1"
log = "0.4"
notify = "8"
# Interactive terminals: a pseudo-terminal on Unix, ConPTY on Windows.
portable-pty = "0.9"
rand = "0.9"
# `beep-node update` downloads releases with ring and webpki roots, as iroh does.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rmp-serde = "1"
roxmltree = "0.20"
# flsh keeps its sessions in SQLite; the same version flashmind uses.
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# Custom agent frontmatter; the same version the server reads personas with.
serde_yaml = "0.9"
sha2 = "0.11"
tar = { version = "0.4", default-features = false, optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "signal", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "1"
# Writes Beep's keys into flsh's config.toml, keeping the rest as it was.
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
webpki-roots = { version = "1", optional = true }
which = "8"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
# Reads what Beep writes to flsh's config with flsh's own types.
flashmind-types = { git = "https://github.com/flashmind-labs/flashmind.git" }

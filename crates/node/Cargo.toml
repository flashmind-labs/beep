[package]
name = "beep-node"
version = "0.8.28"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["cli"]
# Everything that runs on a machine: agents, terminals, file sync and
# transfers, the machine's services. The phone app leaves it out and keeps the
# link types it shares with the mesh.
host = [
    "dep:strum",
    "dep:tokio-stream",
    "dep:url",
    "dep:agent-client-protocol",
    "dep:bao-tree",
    "dep:base64",
    "dep:beep-mesh",
    "beep-mesh/thumbs",
    "dep:beep-projects",
    "dep:beep-report",
    "dep:blake3",
    "dep:chrono",
    "dep:diffy",
    "dep:dirs",
    "dep:dunce",
    "dep:flashmind-tools",
    "dep:flashmind-types",
    "dep:futures",
    "dep:gix",
    "dep:gix-revision",
    "dep:hex",
    "dep:humantime",
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:image",
    "dep:ignore",
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:iroh-metrics",
    "dep:irpc",
    "dep:jsonschema",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:log",
    "dep:notify",
    "dep:portable-pty",
    "dep:semver",
    "dep:prost",
    "dep:protox",
    "dep:rand",
    "dep:regex",
    "dep:reqwest",
    "dep:rmp",
    "dep:rmp-serde",
    "dep:rust-ini",
    "dep:roxmltree",
    "dep:rusqlite",
    "dep:secrecy",
    "dep:serde",
    "dep:serde_bytes",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:tokio-util",
    "dep:tracing",
    "dep:tempfile",
    "dep:toml",
    "dep:toml_edit",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:tower",
    "dep:url",
    "dep:uuid",
    "dep:which",
    "dep:libc",
    "dep:rustix",
    "dep:windows-sys",
    "dep:thiserror",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
    "beep-proto/logging",
    "beep-proto/https",
    "beep-proto/http2",
]
# The command line; a host that embeds the node, such as the Mac app, leaves it out.
# `beep-node update` comes with it, with what it downloads and unpacks with.
cli = [
    "host",
    "port-mapping",
    "dep:clap",
]

# The desktop reuses its endpoint, which disables automatic port mapping.
port-mapping = ["host", "iroh/portmapper"]

[[bin]]
name = "beep-node"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
agent-client-protocol = { workspace = true, features = ["unstable_end_turn_token_usage", "unstable_protocol_v2"], optional = true }
anyhow.workspace = true
bao-tree = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
beep-mesh = { workspace = true, optional = true }
# Reads CI runs as the desktop does.
beep-projects = { workspace = true, optional = true }
beep-proto.workspace = true
beep-report = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "env"], optional = true }
diffy = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
# `fs::canonicalize` without the verbatim prefix Windows programs refuse.
dunce = { workspace = true, optional = true }
fastrand.workspace = true
flate2 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
gix = { workspace = true, features = ["parallel", "sha1", "sha256"], optional = true }
gix-revision = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
humantime = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
# Device frames: the emulator's pixels encoded, the simulator's measured.
image = { workspace = true, features = ["jpeg", "png"], optional = true }
# Port mapping and metrics: a node is reached from outside.
iroh = { workspace = true, optional = true }
iroh-blobs = { workspace = true, optional = true }
irpc = { workspace = true, optional = true }
iroh-metrics = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
log = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
# Interactive terminals: a pseudo-terminal on Unix, ConPTY on Windows.
portable-pty = { workspace = true, optional = true }
# The Android emulator's and idb's gRPC services, client side only.
prost = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
# `beep-node update` downloads releases, and the CI watch asks GitHub, with
# the client setup from `beep_proto::https`.
reqwest = { workspace = true, optional = true }
rmp = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
# The Android emulator's discovery files.
rust-ini = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
# flsh keeps its sessions in SQLite; the search index is SQLite too.
rusqlite = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Custom agent frontmatter; the same version the server reads personas with.
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
strum = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time", "fs", "signal", "io-util", "net", "sync"] }
tokio-stream = { workspace = true, features = ["sync"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
tempfile = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
# Writes Beep's keys into flsh's config.toml, keeping the rest as it was.
toml_edit = { workspace = true, optional = true }
tonic = { workspace = true, features = ["channel", "codegen"], optional = true }
tonic-prost = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
which = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

# The media and decision tools the MCP server offers from the saved API keys.
flashmind-tools = { workspace = true, features = ["http"], optional = true }
flashmind-types = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# A session's own Docker socket, between its agent and the daemon.
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, features = ["client", "server", "http1"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
libc = { workspace = true, optional = true }
rustix = { workspace = true, features = ["fs", "process"], optional = true }

# idb_companion listens on a Unix socket.
[target.'cfg(target_os = "macos")'.dependencies]
tower = { workspace = true, features = ["util"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
# The companion client is pure Rust over Unix sockets; type-check and test it on Linux too.
hyper-util = { workspace = true, features = ["tokio"] }
tower = { workspace = true, features = ["util"] }
iroh-tickets.workspace = true
# Checks that no process-wide crypto provider gets installed.
rustls.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Captures the log lines the actor timing writes.
tracing-subscriber = { workspace = true, features = ["fmt"] }
# Reads what Beep writes to flsh's config with flsh's own types.
flashmind-types.workspace = true

[build-dependencies]
protox = { workspace = true, optional = true }
tonic-prost-build = { workspace = true, optional = true }

# Used only by the generated gRPC clients, and `rust-ini` is imported as `ini`.
[package.metadata.cargo-machete]
ignored = ["tonic-prost", "rust-ini"]

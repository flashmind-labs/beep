[package]
name = "beep-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
beep-proto = { path = "../proto" }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
flashmind = { git = "https://github.com/flashmind-labs/flashmind.git", features = ["mcp", "composio", "cron", "memory", "memory-postgres"] }
futures = "0.3"
rmp-serde = "1"
iroh = "1.3"
rust_decimal = "1"
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
sqlx-core = { version = "0.8.6", features = ["migrate"] }
# chrono, json and migrate go on the driver: as sqlx features they drag its
# SQLite driver into resolution, which clashes with rusqlite over libsqlite3-sys.
sqlx-postgres = { version = "0.8.6", features = ["chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
log = "0.4"
logforth = { version = "0.30", features = ["starter-log"] }
uuid = { version = "1", features = ["v4", "serde"] }
html2text = "0.17"

[dev-dependencies]
async-stream = "0.3"
tempfile = "3"

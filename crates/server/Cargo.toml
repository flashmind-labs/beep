[package]
name = "beep-server"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
# HTTP behind a proxy that holds TLS.
axum = { version = "0.8", features = ["http2"] }
beep-proto = { path = "../proto", features = ["logging", "https"] }
beep-report = { path = "../report" }
chrono = "0.4"
hex = "0.4"
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
log = "0.4"
rmp-serde = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2"] }
rusty-s3 = "0.11"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

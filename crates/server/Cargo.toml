[package]
name = "beep-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# HTTP behind a proxy that holds TLS.
axum = { workspace = true, features = ["http1", "http2", "tokio", "tracing", "tower-log"] }
beep-proto = { workspace = true, features = ["logging", "https"] }
beep-report.workspace = true
chrono.workspace = true
hex.workspace = true
iroh-base = { workspace = true, features = ["key"] }
log.workspace = true
reqwest = { workspace = true, features = ["http2"] }
rmp-serde.workspace = true
rusty-s3.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true

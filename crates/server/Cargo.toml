[package]
name = "beep-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
beep-quic-client = { path = "../quic-client" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
flashmind = { git = "https://github.com/flashmind-labs/flashmind.git", features = ["mcp"] }
futures = "0.3"
http = "1"
iroh = "1.3"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-rusqlite = "0.7"
toml = "1"
log = "0.4"
logforth = { version = "0.30", features = ["starter-log"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-stream = "0.3"
tempfile = "3"

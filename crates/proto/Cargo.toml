[package]
name = "beep-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
uniffi = ["dep:uniffi"]

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
curve25519-dalek = "5"
ed25519-dalek = "3"
bytes = "1"
chacha20poly1305 = "0.10"
flashmind-types = { git = "https://github.com/flashmind-labs/flashmind.git" }
futures = "0.3"
iroh = "1.3"
log = "0.4"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
uniffi = { version = "0.32", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

[package]
name = "beep-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
# Sealing push notices to a phone, done by the server.
seal = ["dep:chacha20poly1305"]
# The apps' HTTP client of the server.
client = ["https", "reqwest/stream", "tokio-util/io"]
# The HTTPS client setup every crate shares: rustls with ring and webpki roots.
https = ["dep:reqwest", "dep:rustls", "dep:webpki-roots"]
# HTTP/2 for the HTTPS client; a phone speaks HTTP/1.1.
http2 = ["https", "reqwest/http2"]
# Logging setup for the node and server binaries.
logging = ["dep:tracing", "dep:tracing-log", "dep:tracing-subscriber"]

[dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = "1"
curve25519-dalek = "5"
ed25519-dalek = "3"
bytes = "1"
chacha20poly1305 = { version = "0.10", optional = true }
flashmind-types = { git = "https://github.com/flashmind-labs/flashmind.git" }
futures = "0.3"
# Lean for the phone; a node and the server turn on the defaults.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rmp-serde = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-log = { version = "0.2", default-features = false, features = ["std", "log-tracer"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "tracing-log"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time", "test-util"] }

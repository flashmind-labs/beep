[package]
name = "beep-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The HTTPS client setup every crate shares: rustls with ring and webpki roots.
https = ["dep:reqwest", "dep:rustls", "dep:webpki-roots"]
# HTTP/2 for the HTTPS client; a phone speaks HTTP/1.1.
http2 = ["https", "reqwest/http2"]
# Logging setup for the node and server binaries.
logging = ["dep:tracing", "dep:tracing-log", "dep:tracing-subscriber", "uuid/v4"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
bytes.workspace = true
flashmind-types.workspace = true
futures.workspace = true
iroh.workspace = true
log.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"], optional = true }
rmp-serde.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"], optional = true }
serde.workspace = true
serde_bytes.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-io-timeout.workspace = true
tokio-util.workspace = true
tracing = { workspace = true, optional = true }
tracing-log = { workspace = true, features = ["log-tracer"], optional = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "tracing-log"], optional = true }
url.workspace = true
uuid = { workspace = true, features = ["serde"] }
webpki-roots = { workspace = true, optional = true }
zstd.workspace = true

[dev-dependencies]
n0-error.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

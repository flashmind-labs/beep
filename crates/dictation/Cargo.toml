[package]
name = "beep-dictation"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
flashmind = { git = "https://github.com/flashmind-labs/flashmind.git", default-features = false, features = ["llm"] }
futures = "0.3"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[package]
name = "beep-projects"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
beep-proto = { path = "../proto" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
shlex = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
url = { version = "2", features = ["serde"] }

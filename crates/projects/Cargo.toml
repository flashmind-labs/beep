[package]
name = "beep-projects"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
async-trait = "0.1"
base64 = "0.23"
beep-proto = { path = "../proto", features = ["https"] }
# Lean for the phone; a node and the server turn on the defaults.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
futures = "0.3"
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
shlex = "2"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "net", "io-util"] }
tempfile = "3"

[package]
name = "beep-mesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
iroh = "1.3"
iroh-tickets = "1"
postcard = { version = "1", features = ["use-std"] }
subtle = "2"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

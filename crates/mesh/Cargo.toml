[package]
name = "beep-mesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
beep-proto = { path = "../proto" }
crc32fast = "1"
fastrand = "2"
futures = "0.3"
iroh = "1.3"
iroh-tickets = "1"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

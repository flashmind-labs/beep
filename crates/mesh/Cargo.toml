[package]
name = "beep-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Agent log pictures made small, by a node or the server. The phone draws
# what it is given.
thumbs = ["dep:image"]
# `Snapshots` methods that make a node push, for tests of crates above.
test-util = []

[dependencies]
anyhow.workspace = true
beep-proto = { workspace = true, features = ["https"] }
blake3.workspace = true
bytes.workspace = true
crc32fast.workspace = true
fastrand.workspace = true
futures.workspace = true
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"], optional = true }
iroh.workspace = true
iroh-tickets.workspace = true
metrics.workspace = true
reqwest = { workspace = true, features = ["json"] }
rmp-serde.workspace = true
serde.workspace = true
serde_bytes.workspace = true
shlex.workspace = true
strum.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# The default features carry the in-process terminal host the tests start.
beep-node = { workspace = true, default-features = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

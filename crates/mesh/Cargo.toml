[package]
name = "beep-mesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
beep-proto = { path = "../proto" }
bytes = "1"
crc32fast = "1"
fastrand = "2"
futures = "0.3"
iroh = "1.3"
iroh-tickets = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
shlex = "1"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
# The default features carry the in-process terminal host the tests start.
beep-node = { path = "../node" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

# Releases beep-node for a `node-v<version>` tag (made by `just patch`,
# `just minor` or `just release`). The tag must match crates/node/Cargo.toml.
#
# Linux runners cross-build the static Linux binaries (x86_64 and aarch64
# musl) in Docker with zig and x86_64-pc-windows-msvc with cargo-xwin, the Mac
# runner builds aarch64-apple-darwin and x86_64-apple-darwin, the Linux job pushes the beep-node
# image (amd64 and arm64) to GHCR, and a
# last job attaches the archives and SHA256SUMS to the tag's GitHub release
# and uploads them to the R2 bucket under beep/node/<version>/, served at
# https://releases.flashmind.com/beep/node/. latest.txt there names the newest
# version and install.sh reads it:
#
#   curl -fsSL https://releases.flashmind.com/beep/node/install.sh | sh
#
# The R2 upload is skipped until the CF_* secrets are set.
name: node

on:
  push:
    tags: ["node-v*"]

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

# Built into the binary: where `beep-node report` sends a problem report.
env:
  BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: boat-large
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: bash scripts/check-node-version.sh

      - name: Build
        run: docker build --build-arg BEEP_SERVER_URL --target node-dist --output "type=local,dest=$RUNNER_TEMP/node-bin" .

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            tar -czf "dist/beep-node-$VERSION-$target.tar.gz" -C "$RUNNER_TEMP/node-bin/$target" beep-node
          done

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/beep-node"
          docker buildx build --platform linux/amd64,linux/arm64 --target node-image \
            --build-context "node-dist=$RUNNER_TEMP/node-bin" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$VERSION" --tag "$image:latest" --push .

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/node-bin"

      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: node-linux
          path: dist/*.tar.gz

  windows:
    runs-on: boat-large
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: bash scripts/check-node-version.sh

      - name: Build
        run: docker build --build-arg BEEP_SERVER_URL --target node-dist-windows --output "type=local,dest=$RUNNER_TEMP/node-win" .

      # install.ps1 and `beep-node update` look for beep-node.exe at the
      # top of the zip.
      - name: Package
        run: |
          set -euo pipefail
          target=x86_64-pc-windows-msvc
          mkdir -p dist
          python3 -c 'import sys, zipfile; z = zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED); z.write(sys.argv[2], "beep-node.exe"); z.close()' \
            "dist/beep-node-$VERSION-$target.zip" "$RUNNER_TEMP/node-win/$target/beep-node.exe"
          rm -rf "$RUNNER_TEMP/node-win"

      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: node-windows
          path: dist/*.zip

  macos:
    runs-on: beep-mac
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: bash scripts/check-node-version.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # The runner is ours and runs one job at a time: builds share a target
      # folder outside the checkout, which checkout would wipe, capped at 40 GB.
      - name: Keep the build folder between runs
        run: |
          dir="$HOME/Library/Caches/beep-ci/target"
          if [[ -d "$dir" ]] && (( $(du -sk "$dir" | cut -f1) > 40 * 1024 * 1024 )); then
            rm -rf "$dir"
          fi
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --package beep-node --bin beep-node --target "$target"
            # Without AppleDouble ._ entries for the binary's extended attributes.
            COPYFILE_DISABLE=1 tar -czf "dist/beep-node-$VERSION-$target.tar.gz" -C "$CARGO_TARGET_DIR/$target/release" beep-node
          done

      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: node-macos
          path: dist/*.tar.gz

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: bash scripts/check-node-version.sh

      - uses: actions/download-artifact@v8
        with:
          name: node-linux
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: node-macos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: node-windows
          path: dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum beep-node-*.tar.gz beep-node-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/changelog.py notes "$VERSION" --path changelogs/node.md > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "beep-node $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

      - name: Stage the R2 upload
        id: r2
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_ENDPOINT" ]]; then echo "No R2 secrets, skipping"; exit 0; fi
          account=$(bash scripts/r2.sh account)
          echo "account=$account" >> "$GITHUB_OUTPUT"
          files="$RUNNER_TEMP/r2-node-files"
          pointer="$RUNNER_TEMP/r2-node-pointer"
          rm -rf "$files" "$pointer"
          mkdir -p "$files" "$pointer"
          cp dist/*.tar.gz dist/*.zip dist/SHA256SUMS "$files/"
          cp crates/node/install.sh "$pointer/install.sh"
          cp crates/node/install.ps1 "$pointer/install.ps1"
          printf '%s\n' "$VERSION" > "$pointer/latest.txt"
          if [[ "$VERSION" == *.0 ]]; then
            cp "$pointer/latest.txt" "$pointer/minor.txt"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "pointer=$pointer" >> "$GITHUB_OUTPUT"

      - name: Upload the release to R2
        if: steps.r2.outputs.files != ''
        uses: ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ steps.r2.outputs.files }}
          destination-dir: beep/node/${{ env.VERSION }}

      # After the archives, so install.sh never names a version it cannot
      # fetch. Uploaded with curl rather than the action, which cannot set
      # Cache-Control: these two change with every release, so the CDN has to
      # check back each time instead of serving the last version for hours.
      - name: Point install.sh at the release
        if: steps.r2.outputs.files != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          POINTER: ${{ steps.r2.outputs.pointer }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        run: |
          set -euo pipefail
          for name in install.sh install.ps1 latest.txt minor.txt; do
            [[ -f "$POINTER/$name" ]] || continue
            bash scripts/r2.sh put "$POINTER/$name" "beep/node/$name" "text/plain; charset=utf-8"
            echo "Uploaded beep/node/$name"
          done

      - name: Remove earlier versions from R2
        if: steps.r2.outputs.files != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        # The minor feed still points at this minor's .0 release after patches.
        run: python3 scripts/r2-prune.py beep/node "${VERSION%.*}.0"

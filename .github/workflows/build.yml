name: build

on:
  push:
    tags: ["server-v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: boat-large
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the server image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/beep-server"
          docker buildx build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" --tag "$image:latest" --push .

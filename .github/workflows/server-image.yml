# Builds the server image on every push to main and publishes it to GHCR,
# tagged with the commit and `latest`. `just deploy-server` pulls it.
name: server image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beep-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/beep-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Uploads a tag ios-vX.Y.Z (made by `just patch`, `just minor` or
# `just release`) to TestFlight for invited beta testers. The phone app is the
# desktop Tauri app built for iOS; its version is "version" in apps/desktop/src-tauri/tauri.ios.conf.json and
# the build number adds 10000 to the workflow run number.
#
# The repository variable BEEP_SERVER_URL sets the report server address.
name: ios

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: warp-macos-26-arm64-6x
    env:
      BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/ios-v* ]]; then
            name=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' apps/desktop/src-tauri/tauri.ios.conf.json)
            [ "$name" = "${REF#refs/tags/ios-v}" ] || { echo "Tag does not match version $name"; exit 1; }
          fi

      - name: Check configuration
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          set -euo pipefail
          for name in IOS_TEAM_ID APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID \
            IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name" >&2
              exit 1
            fi
          done
          [[ "$BEEP_SERVER_URL" =~ ^https:// ]] || {
            echo "BEEP_SERVER_URL must be the server's https:// address" >&2
            exit 1
          }
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Missing numeric build number" >&2
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: llvm-tools
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare App Store Connect key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/ios-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/ios-api-key.p8" >> "$GITHUB_ENV"

      - name: Import distribution certificate
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/keychain.sh import ios ios-signing.p12 IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_PASSWORD

      - name: Install the provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          profile="$RUNNER_TEMP/ios.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/ios-profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/ios-profile.plist")
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          install -m 600 "$profile" "$profiles/$uuid.mobileprovision"

      - name: Build the web UI
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Generate the Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.IOS_TEAM_ID }}
        run: bash scripts/tauri-init.sh ios

      - name: Build the IPA
        working-directory: apps/desktop
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.IOS_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          npm run tauri -- ios build --export-method app-store-connect \
            --build-number "$((10000 + GITHUB_RUN_NUMBER))"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa=$(find apps/desktop/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "No IPA was built" >&2; exit 1; }
          xcrun altool --upload-app -f "$ipa" -t ios \
            --api-key "$APPLE_API_KEY_ID" --api-issuer "$APPLE_API_ISSUER_ID" \
            --p8-file-path "$APPLE_API_KEY_PATH"

      - name: Remove signing assets
        if: always()
        run: |
          bash scripts/keychain.sh remove ios
          rm -rf "$RUNNER_TEMP/ios-api-key.p8" "$RUNNER_TEMP/ios-signing.p12" \
            "$RUNNER_TEMP/ios-keychains.txt"

# Builds and releases desktop installers for a `desktop-v<version>` tag
# (made by `just patch`, `just minor` or `just release`).
# It must be signed and notarized, its version must match the tag, and the
# Apple silicon and Intel DMGs are attached to a GitHub release for the tag
# and uploaded to R2 with the archives installed apps update themselves from.
#
# The repository variable BEEP_SERVER_URL sets the report server address.
#
# The macOS build requires the Developer ID certificate and App Store Connect API
# secrets. The app and disk image are signed, notarized, and verified.
name: desktop

on:
  push:
    tags: ["desktop-v*"]

# Per tag, so different releases do not cancel each other.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dmg:
    runs-on: beep-mac
    permissions:
      contents: write
    env:
      BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v7

      # The runner is ours and runs one job at a time: builds share a target
      # folder outside the checkout, which checkout would wipe, capped at 40 GB.
      - name: Keep the build folder between runs
        run: |
          dir="$HOME/Library/Caches/beep-ci/target"
          if [[ -d "$dir" ]] && (( $(du -sk "$dir" | cut -f1) > 40 * 1024 * 1024 )); then
            rm -rf "$dir"
          fi
          mkdir -p "$dir"
          # The bundle folders keep the last release's app.
          rm -rf "$dir"/*-apple-darwin/release/bundle
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # One app per architecture: a universal app is twice the download.
      # Each step loops over ARCHES; ${arch/arm64/aarch64} is the Rust name.
      - name: Set the architectures
        run: echo "ARCHES=arm64 x86_64" >> "$GITHUB_ENV"

      - name: Check signing credentials and version
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret $name" >&2
              exit 1
            fi
          done
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "desktop-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match the app's version $version." >&2
            exit 1
          fi
          python3 -m unittest discover -s scripts/tests
          python3 scripts/changelog.py notes "$version" > "$RUNNER_TEMP/release-notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare the native macOS updater
        run: |
          command -v cmake >/dev/null || brew install cmake
          bash scripts/download-sparkle.sh

      - name: Build the web UI
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Import signing credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          bash scripts/keychain.sh import beep signing.p12 MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      # Copied as a custom bundle file so Tauri preserves these helper signatures.
      - name: Sign the native updater helpers
        run: bash scripts/sign-sparkle.sh

      - name: Build the app
        working-directory: apps/desktop/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # A smaller app for downloads; only releases pay the longer link.
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: |
          set -euo pipefail
          # Tauri runs `xattr -crs` before signing, and the pip xattr in
          # /opt/homebrew/bin has no -r.
          # The signed archive is what the app updates itself from.
          # Only this signed build has the native updater: a local build signed
          # ad hoc cannot load Sparkle.framework under the hardened runtime.
          for arch in $ARCHES; do
            target="${arch/arm64/aarch64}-apple-darwin"
            PATH="/usr/bin:$PATH" ../node_modules/.bin/tauri build --target "$target" \
              --bundles app --features sparkle \
              --config tauri.sparkle.conf.json \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
            app="$CARGO_TARGET_DIR/$target/release/bundle/macos/Beep.app"
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            lipo "$app/Contents/MacOS/beep-desktop" -verify_arch "$arch"
          done

      - name: Package and notarize the DMGs
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for arch in $ARCHES; do
            BUNDLE="$CARGO_TARGET_DIR/${arch/arm64/aarch64}-apple-darwin/release/bundle/macos" \
              DMG="target/macos-release/Beep-$VERSION-$arch.dmg" \
              bash scripts/release-macos-dmg.sh
          done

      # One feed for both: Sparkle skips the arm64 item on Intel Macs.
      - name: Sign the Sparkle updates and write release notes
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/write-macos-appcast.py \
            --app "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos/Beep.app" \
            --dmg "target/macos-release/Beep-$VERSION-arm64.dmg" \
            --dmg "target/macos-release/Beep-$VERSION-x86_64.dmg" \
            --version "$VERSION" --output target/macos-release/appcast.xml

      - name: Remove signing material
        if: always()
        run: |
          bash scripts/keychain.sh remove beep
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/beep-keychains.txt" "$RUNNER_TEMP/beep-sparkle.key"

      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: beep-macos
          path: |
            target/macos-release/*.dmg
            target/macos-release/*.sha256
            target/macos-release/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Beep desktop $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            target/macos-release/*.dmg target/macos-release/*.sha256 \
            target/macos-release/appcast.xml

      # Also into the R2 bucket under beep/macos/, served at
      # https://releases.flashmind.com/beep/macos/. Beep-latest.dmg (Apple
      # silicon) and Beep-latest-x86_64.dmg (Intel) are the download links that
      # never change, and latest.json tells installed apps
      # about the update archive. Skipped until the CF_* secrets are set.
      - name: Stage the R2 upload
        id: r2
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_ENDPOINT" ]]; then echo "No R2 secrets, skipping"; exit 0; fi
          account=$(bash scripts/r2.sh account)
          echo "account=$account" >> "$GITHUB_OUTPUT"
          files="$RUNNER_TEMP/r2-files"
          manifest="$RUNNER_TEMP/r2-manifest"
          mkdir -p "$files" "$manifest"
          cp target/macos-release/*.dmg target/macos-release/*.sha256 "$files/"
          cp target/macos-release/appcast.xml "$manifest/"
          cp "$files/Beep-$VERSION-arm64.dmg" "$files/Beep-latest.dmg"
          cp "$files/Beep-$VERSION-x86_64.dmg" "$files/Beep-latest-x86_64.dmg"
          platforms='{}'
          for arch in $ARCHES; do
            rust="${arch/arm64/aarch64}"
            bundle="$CARGO_TARGET_DIR/$rust-apple-darwin/release/bundle/macos"
            archive="Beep-$VERSION-$rust.app.tar.gz"
            cp "$bundle/Beep.app.tar.gz" "$files/$archive"
            platforms=$(jq --arg key "darwin-$rust" \
              --arg signature "$(cat "$bundle/Beep.app.tar.gz.sig")" \
              --arg url "https://releases.flashmind.com/beep/macos/$archive" \
              '. + {($key): {signature: $signature, url: $url}}' <<< "$platforms")
          done
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes "$RUNNER_TEMP/release-notes.md" --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' \
            > "$manifest/latest.json"
          # Apps outside Developer mode read the minor feeds, so they skip patches.
          if [[ "$VERSION" == *.0 ]]; then
            cp "$manifest/appcast.xml" "$manifest/appcast-minor.xml"
            cp "$manifest/latest.json" "$manifest/minor.json"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Upload the release to R2
        if: steps.r2.outputs.files != ''
        uses: ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ steps.r2.outputs.files }}
          destination-dir: beep/macos

      # After the archive, so no app sees an update it cannot fetch yet.
      - name: Point installed apps at the update
        if: steps.r2.outputs.files != ''
        uses: ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ steps.r2.outputs.manifest }}
          destination-dir: beep/macos

      - name: Remove earlier versions from R2
        if: steps.r2.outputs.files != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        # Keeps this minor's earlier releases: the minor feed points at its .0.
        run: python3 scripts/r2-prune.py beep/macos "${VERSION%.*}.0"

  linux:
    runs-on: boat-large
    env:
      BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          [[ "desktop-v$version" == "$GITHUB_REF_NAME" ]]
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]

      # Debian 12 keeps the glibc requirement below that of the build host.
      - name: Build Debian and AppImage installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          docker build -f scripts/Dockerfile.desktop-linux --build-arg BEEP_SERVER_URL \
            --secret id=updater_key,env=TAURI_SIGNING_PRIVATE_KEY \
            --secret id=updater_password,env=TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            --output type=local,dest=dist/linux .

      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: beep-linux
          path: dist/linux/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check the version and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ("desktop-v$version" -ne $env:GITHUB_REF_NAME) { throw 'The tag does not match the desktop version' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Kept between runs, so a build only recompiles what changed. The
          # workspace is deleted after every job. Past 30 GB, start over.
          $env:CARGO_TARGET_DIR = Join-Path $env:LOCALAPPDATA 'beep-desktop-target'
          if (Test-Path $env:CARGO_TARGET_DIR) {
            $size = (Get-ChildItem $env:CARGO_TARGET_DIR -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Sum Length).Sum
            if ($size -gt 30GB) { Remove-Item -Recurse -Force $env:CARGO_TARGET_DIR }
          }
          # The bundle folder keeps the last release's installer too.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release/bundle/nsis')
          $config = Join-Path $env:RUNNER_TEMP 'desktop-updater.json'
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -Path $config -Encoding ascii
          & ./scripts/build-desktop-windows.ps1 -TauriArgs @('--config', $config, '--', '--locked')
          if ($LASTEXITCODE) { throw 'Windows desktop build failed' }
          # A reused workspace can keep an earlier release's installer here.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist/windows
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe*" dist/windows/

      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: beep-windows
          path: dist/windows/*
          if-no-files-found: error

  publish-installers:
    # The DMG job creates the tag's release. Attach the other installers to it.
    needs: [dmg, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: beep-${{ matrix.platform }}
          path: dist

      - name: Stage installers and updater manifest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/stage-desktop-release.py "$PLATFORM" dist "$RUNNER_TEMP/desktop-release-${{ github.run_id }}-${{ matrix.platform }}"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "$RUNNER_TEMP/desktop-release-${{ github.run_id }}-${{ matrix.platform }}/files/"*

      - name: Check the R2 configuration
        id: r2
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_ENDPOINT" ]]; then echo "No R2 secrets, skipping"; exit 0; fi
          account=$(bash scripts/r2.sh account)
          echo "account=$account" >> "$GITHUB_OUTPUT"

      - name: Upload installers to R2
        if: steps.r2.outputs.account != ''
        uses: ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ runner.temp }}/desktop-release-${{ github.run_id }}-${{ matrix.platform }}/files
          destination-dir: beep/${{ matrix.platform }}

      - name: Point installed apps at the update
        if: steps.r2.outputs.account != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          PLATFORM: ${{ matrix.platform }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/desktop-release-${{ github.run_id }}-${{ matrix.platform }}/manifest/latest.json"
          bash scripts/r2.sh put "$file" "beep/$PLATFORM/latest.json" application/json
          # Apps outside Developer mode read the minor feed, so they skip patches.
          if [[ "$GITHUB_REF_NAME" == *.0 ]]; then
            bash scripts/r2.sh put "$file" "beep/$PLATFORM/minor.json" application/json
          fi

      - name: Remove earlier versions from R2
        if: steps.r2.outputs.account != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          PLATFORM: ${{ matrix.platform }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        # Keeps this minor's earlier releases: the minor feed points at its .0.
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          python3 scripts/r2-prune.py "beep/$PLATFORM" "${version%.*}.0"

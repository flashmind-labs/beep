# The server on the remote Docker host. Forgejo CI publishes the image on
# every push to main and `just deploy-server` starts it there. The
# config and iroh key live in the `beep_data` volume.
name: beep
services:
  server:
    image: ${BEEP_IMAGE:?Set BEEP_IMAGE in .env}:${BEEP_TAG:-latest}
    restart: unless-stopped
    # A stopping server lets running turns finish for 40s, then saves the
    # rest as interrupted (see `DRAIN` in crates/server/src/main.rs).
    stop_grace_period: 60s
    # Host networking lets iroh hole-punch direct paths to the phone.
    network_mode: host
    volumes:
      - data:/data
volumes:
  # Created by `just push-server-config`, which fills it before the first start.
  data:
    name: beep_data
    external: true

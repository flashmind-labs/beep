# Builds and releases desktop installers for a `desktop-v<version>` tag
# (made by `just desktop-release <version>`).
# It must be signed and notarized, its version must match
# the tag, and the DMG is attached to a Forgejo release for the tag and
# uploaded to R2 with the archive installed apps update themselves from.
#
# Runs on a Mac registered with the `macos` label, with Rust, tauri-cli, Node
# and uv installed for the runner's user. The server's https:// address is the
# repository variable BEEP_SERVER_URL.
#
# The macOS build requires the Developer ID certificate and App Store Connect API
# secrets. The app and disk image are signed, notarized, and verified.
name: desktop

on:
  push:
    tags: ["desktop-v*"]

# Per tag, so different releases do not cancel each other.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos
    env:
      BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing credentials and version
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret $name" >&2
              exit 1
            fi
          done
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$RELEASE" == true && "desktop-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match the app's version $version." >&2
            exit 1
          fi
          python3 -m unittest discover -s scripts/tests
          python3 scripts/changelog.py notes "$version" > "$RUNNER_TEMP/release-notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up the toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Kept between runs, so a build only recompiles what changed.
          target="$HOME/Library/Caches/beep-desktop-target"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          # It only grows, and a full disk fails every build: past 30 GB, start over.
          if [ -d "$target" ] && [ "$(du -sk "$target" | cut -f1)" -gt $((30 * 1024 * 1024)) ]; then
            rm -rf "$target"
          fi

      - name: Prepare the native macOS updater
        run: bash scripts/download-sparkle.sh

      - name: Build the web UI
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Import signing credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          security list-keychains -d user | sed 's/^ *"//; s/"$//' > "$RUNNER_TEMP/beep-keychains.txt"
          keychain="$RUNNER_TEMP/beep-signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          keychains=("$keychain")
          while IFS= read -r previous; do keychains+=("$previous"); done < "$RUNNER_TEMP/beep-keychains.txt"
          security list-keychains -d user -s "${keychains[@]}"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      # Copied as a custom bundle file so Tauri preserves these helper signatures.
      - name: Sign the native updater helpers
        run: bash scripts/sign-sparkle.sh

      - name: Build the app
        working-directory: apps/desktop/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A release also makes the signed archive the app updates itself from.
          extra=()
          if [[ "$RELEASE" == true ]]; then
            extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          # Tauri runs `xattr -crs` before signing, and the pip xattr in
          # /opt/homebrew/bin has no -r.
          # bash 3.2 treats an empty "${extra[@]}" as unset under set -u.
          PATH="/usr/bin:$PATH" cargo tauri build --bundles app ${extra[@]+"${extra[@]}"}
          app="$CARGO_TARGET_DIR/release/bundle/macos/Beep.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          lipo "$app/Contents/MacOS/beep-desktop" -verify_arch "$(uname -m)"

      - name: Package and notarize the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/release-macos-dmg.sh

      - name: Sign the Sparkle update and write release notes
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/write-macos-appcast.py \
            --app "$CARGO_TARGET_DIR/release/bundle/macos/Beep.app" \
            --dmg "target/macos-release/Beep-$VERSION-$(uname -m).dmg" \
            --version "$VERSION" --output target/macos-release/appcast.xml

      - name: Remove signing material
        if: always()
        run: |
          # Drop only this job's keychain. Restoring the list saved at the
          # start would also drop one another job on this Mac added since.
          keychains=()
          while IFS= read -r current; do
            [[ "$current" == */beep-signing.keychain-db ]] || keychains+=("$current")
          done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "${keychains[@]}"
          security delete-keychain "$RUNNER_TEMP/beep-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/beep-keychains.txt" "$RUNNER_TEMP/beep-sparkle.key"

      - uses: actions/upload-artifact@v3
        with:
          name: beep-macos
          path: |
            target/macos-release/*.dmg
            target/macos-release/*.sha256
            target/macos-release/appcast.xml

      - name: Publish the release
        if: env.RELEASE == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          dmg="target/macos-release/Beep-$VERSION-$(uname -m).dmg"
          release=$(jq -n --arg tag "$GITHUB_REF_NAME" --arg name "Beep desktop $VERSION" \
            --rawfile notes "$RUNNER_TEMP/release-notes.md" \
            '{tag_name: $tag, name: $name, body: $notes}' \
            | curl -sSf -X POST -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" --data @- "$API/releases" \
            | jq -r .id)
          for file in "$dmg" "$dmg.sha256" target/macos-release/appcast.xml; do
            name=${file##*/}
            curl -sSf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$file" "$API/releases/$release/assets?name=$name" > /dev/null
          done
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

      # Also into the R2 bucket under beep/macos/, served at
      # https://releases.flashmind.com/beep/macos/. Beep-latest.dmg is the
      # download link that never changes, and latest.json tells installed apps
      # about the update archive. Skipped until the CF_* secrets are set.
      - name: Stage the R2 upload
        id: r2
        if: env.RELEASE == 'true'
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_ENDPOINT" ]]; then echo "No R2 secrets, skipping"; exit 0; fi
          account=${CF_ENDPOINT#https://}
          echo "account=${account%%.*}" >> "$GITHUB_OUTPUT"
          dmg="target/macos-release/Beep-$VERSION-$(uname -m).dmg"
          bundle="$CARGO_TARGET_DIR/release/bundle/macos"
          archive="Beep-$VERSION-aarch64.app.tar.gz"
          files="$RUNNER_TEMP/r2-files"
          manifest="$RUNNER_TEMP/r2-manifest"
          mkdir -p "$files" "$manifest"
          cp "$dmg" "$dmg.sha256" "$files/"
          cp target/macos-release/appcast.xml "$manifest/"
          cp "$dmg" "$files/Beep-latest.dmg"
          cp "$bundle/Beep.app.tar.gz" "$files/$archive"
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes "$RUNNER_TEMP/release-notes.md" \
            --arg signature "$(cat "$bundle/Beep.app.tar.gz.sig")" \
            --arg url "https://releases.flashmind.com/beep/macos/$archive" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > "$manifest/latest.json"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Upload the release to R2
        if: steps.r2.outputs.files != ''
        uses: https://github.com/ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ steps.r2.outputs.files }}
          destination-dir: beep/macos

      # After the archive, so no app sees an update it cannot fetch yet.
      - name: Point installed apps at the update
        if: steps.r2.outputs.files != ''
        uses: https://github.com/ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ steps.r2.outputs.manifest }}
          destination-dir: beep/macos

      - name: Remove earlier versions from R2
        if: steps.r2.outputs.files != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        run: python3 scripts/r2-prune.py beep/macos "$VERSION"

  linux:
    runs-on: host
    env:
      BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          [[ "desktop-v$version" == "$GITHUB_REF_NAME" ]]
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]

      # Debian 12 keeps the glibc requirement below that of the build host.
      - name: Build Debian and AppImage installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          docker build -f scripts/Dockerfile.desktop-linux --build-arg BEEP_SERVER_URL \
            --secret id=updater_key,env=TAURI_SIGNING_PRIVATE_KEY \
            --secret id=updater_password,env=TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            --output type=local,dest=dist/linux .

      - uses: actions/upload-artifact@v3
        with:
          name: beep-linux
          path: dist/linux/*
          if-no-files-found: error

  windows:
    runs-on: windows
    defaults:
      run:
        shell: powershell
    env:
      BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the version and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ("desktop-v$version" -ne $env:GITHUB_REF_NAME) { throw 'The tag does not match the desktop version' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Kept between runs, so a build only recompiles what changed. The
          # workspace is deleted after every job. Past 30 GB, start over.
          $env:CARGO_TARGET_DIR = Join-Path $env:LOCALAPPDATA 'beep-desktop-target'
          if (Test-Path $env:CARGO_TARGET_DIR) {
            $size = (Get-ChildItem $env:CARGO_TARGET_DIR -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Sum Length).Sum
            if ($size -gt 30GB) { Remove-Item -Recurse -Force $env:CARGO_TARGET_DIR }
          }
          $config = Join-Path $env:RUNNER_TEMP 'desktop-updater.json'
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -Path $config -Encoding ascii
          & ./scripts/build-desktop-windows.ps1 -TauriArgs @('--config', $config, '--', '--locked')
          if ($LASTEXITCODE) { throw 'Windows desktop build failed' }
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe*" dist/windows/

      - uses: actions/upload-artifact@v3
        with:
          name: beep-windows
          path: dist/windows/*
          if-no-files-found: error

  publish-installers:
    # The DMG job creates the tag's release. Attach the other installers to it.
    needs: [dmg, linux, windows]
    runs-on: host
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: beep-${{ matrix.platform }}
          path: dist

      - name: Stage installers and updater manifest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/stage-desktop-release.py "$PLATFORM" dist "$RUNNER_TEMP/desktop-release-${{ github.run_id }}-${{ matrix.platform }}"

      - name: Publish the release assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(curl -sSf -H "Authorization: token $TOKEN" \
            "$API/releases/tags/$GITHUB_REF_NAME" | jq -er .id)
          for file in "$RUNNER_TEMP/desktop-release-${{ github.run_id }}-${{ matrix.platform }}/files/"*; do
            name=${file##*/}
            curl -sSf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$file" "$API/releases/$release/assets?name=$name" > /dev/null
          done

      - name: Check the R2 configuration
        id: r2
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_ENDPOINT" ]]; then echo "No R2 secrets, skipping"; exit 0; fi
          account=${CF_ENDPOINT#https://}
          echo "account=${account%%.*}" >> "$GITHUB_OUTPUT"

      - name: Upload installers to R2
        if: steps.r2.outputs.account != ''
        uses: https://github.com/ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ runner.temp }}/desktop-release-${{ github.run_id }}-${{ matrix.platform }}/files
          destination-dir: beep/${{ matrix.platform }}

      - name: Point installed apps at the update
        if: steps.r2.outputs.account != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          PLATFORM: ${{ matrix.platform }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/desktop-release-${{ github.run_id }}-${{ matrix.platform }}/manifest/latest.json"
          curl -sSf --retry 3 --aws-sigv4 "aws:amz:auto:s3" \
            --user "$CF_ACCESS_KEY_ID:$CF_SECRET_ACCESS_KEY" \
            -H "x-amz-content-sha256: $(sha256sum "$file" | cut -d ' ' -f 1)" \
            -H "Cache-Control: no-cache" -H "Content-Type: application/json" \
            -T "$file" "https://$ACCOUNT.r2.cloudflarestorage.com/$CF_BUCKET/beep/$PLATFORM/latest.json" > /dev/null

      - name: Remove earlier versions from R2
        if: steps.r2.outputs.account != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          PLATFORM: ${{ matrix.platform }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        run: python3 scripts/r2-prune.py "beep/$PLATFORM" "${GITHUB_REF_NAME#desktop-v}"

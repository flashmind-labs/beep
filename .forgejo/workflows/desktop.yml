# Builds the macOS DMG on every push to main and keeps it as a run artifact.
# A `desktop-v<version>` tag (made by `just desktop-release <version>`) builds
# a release instead: it must be signed and notarized, its version must match
# the tag, and the DMG is attached to a Forgejo release for the tag and
# uploaded to R2 with the archive installed apps update themselves from.
#
# Runs on a Mac registered with the `macos` label, with Rust, tauri-cli and uv
# installed for the runner's user. The server's node id is the repository
# variable BEEP_NODE_ID.
#
# Every build requires the Developer ID certificate and App Store Connect API
# secrets. The app and disk image are signed, notarized, and verified.
name: desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  workflow_dispatch:

# Per ref, so a push to main never cancels the release of the tag beside it.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos
    env:
      BEEP_NODE_ID: ${{ vars.BEEP_NODE_ID }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing credentials and version
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret $name" >&2
              exit 1
            fi
          done
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$RELEASE" == true && "desktop-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match the app's version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up the toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Kept between runs, so a build only recompiles what changed.
          echo "CARGO_TARGET_DIR=$HOME/Library/Caches/beep-desktop-target" >> "$GITHUB_ENV"

      - name: Check
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Import signing credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          security list-keychains -d user | sed 's/^ *"//; s/"$//' > "$RUNNER_TEMP/beep-keychains.txt"
          keychain="$RUNNER_TEMP/beep-signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          keychains=("$keychain")
          while IFS= read -r previous; do keychains+=("$previous"); done < "$RUNNER_TEMP/beep-keychains.txt"
          security list-keychains -d user -s "${keychains[@]}"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: apps/desktop/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A release also makes the signed archive the app updates itself from.
          extra=()
          if [[ "$RELEASE" == true ]]; then
            extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          # Tauri runs `xattr -crs` before signing, and the pip xattr in
          # /opt/homebrew/bin has no -r.
          PATH="/usr/bin:$PATH" cargo tauri build --bundles app "${extra[@]}"
          app="$CARGO_TARGET_DIR/release/bundle/macos/Beep.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          lipo "$app/Contents/MacOS/beep-desktop" -verify_arch "$(uname -m)"

      - name: Package and notarize the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/release-macos-dmg.sh

      - name: Remove signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/beep-keychains.txt" ]]; then
            keychains=()
            while IFS= read -r previous; do keychains+=("$previous"); done < "$RUNNER_TEMP/beep-keychains.txt"
            security list-keychains -d user -s "${keychains[@]}"
          fi
          security delete-keychain "$RUNNER_TEMP/beep-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/beep-keychains.txt"

      - uses: actions/upload-artifact@v3
        with:
          name: beep-macos
          path: |
            target/macos-release/*.dmg
            target/macos-release/*.sha256

      - name: Publish the release
        if: env.RELEASE == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          dmg="target/macos-release/Beep-$VERSION-$(uname -m).dmg"
          release=$(jq -n --arg tag "$GITHUB_REF_NAME" --arg name "Beep for macOS $VERSION" \
            '{tag_name: $tag, name: $name}' \
            | curl -sSf -X POST -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" --data @- "$API/releases" \
            | jq -r .id)
          for file in "$dmg" "$dmg.sha256"; do
            name=${file##*/}
            curl -sSf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$file" "$API/releases/$release/assets?name=$name" > /dev/null
          done
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

      # Also into the R2 bucket under beep/macos/, served at
      # https://releases.flashmind.com/beep/macos/. Beep-latest.dmg is the
      # download link that never changes, and latest.json tells installed apps
      # about the update archive. Skipped until the CF_* secrets are set.
      - name: Stage the R2 upload
        id: r2
        if: env.RELEASE == 'true'
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_ENDPOINT" ]]; then echo "No R2 secrets, skipping"; exit 0; fi
          account=${CF_ENDPOINT#https://}
          echo "account=${account%%.*}" >> "$GITHUB_OUTPUT"
          dmg="target/macos-release/Beep-$VERSION-$(uname -m).dmg"
          bundle="$CARGO_TARGET_DIR/release/bundle/macos"
          archive="Beep-$VERSION-aarch64.app.tar.gz"
          files="$RUNNER_TEMP/r2-files"
          manifest="$RUNNER_TEMP/r2-manifest"
          mkdir -p "$files" "$manifest"
          cp "$dmg" "$dmg.sha256" "$files/"
          cp "$dmg" "$files/Beep-latest.dmg"
          cp "$bundle/Beep.app.tar.gz" "$files/$archive"
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$bundle/Beep.app.tar.gz.sig")" \
            --arg url "https://releases.flashmind.com/beep/macos/$archive" \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > "$manifest/latest.json"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Upload the release to R2
        if: steps.r2.outputs.files != ''
        uses: https://github.com/ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ steps.r2.outputs.files }}
          destination-dir: beep/macos

      # After the archive, so no app sees an update it cannot fetch yet.
      - name: Point installed apps at the update
        if: steps.r2.outputs.files != ''
        uses: https://github.com/ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ steps.r2.outputs.manifest }}
          destination-dir: beep/macos

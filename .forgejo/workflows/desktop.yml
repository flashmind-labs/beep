# Builds the macOS DMG on every push to main and keeps it as a run artifact.
# A `desktop-v<version>` tag (made by `just desktop-release <version>`) builds
# a release instead: it must be signed and notarized, its version must match
# the tag, and the DMG is attached to a Forgejo release for the tag.
#
# Runs on a Mac registered with the `macos` label, with Rust, tauri-cli and uv
# installed for the runner's user. The server's node id is the repository
# variable BEEP_NODE_ID.
#
# With the MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD,
# APPLE_API_PRIVATE_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID secrets set,
# the app is signed with the Developer ID and notarized, and opens like any
# other download. Without them it is signed ad hoc: the first launch is
# blocked, and System Settings > Privacy & Security > Open Anyway lets it
# through. A release without them fails.
name: desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  workflow_dispatch:

# Per ref, so a push to main never cancels the release of the tag beside it.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos
    env:
      BEEP_NODE_ID: ${{ vars.BEEP_NODE_ID }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the release
        if: env.RELEASE == 'true'
        env:
          HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_CERTIFICATE" != true ]]; then
            echo "A release must be signed and notarized; set the MACOS_CERTIFICATE_* and APPLE_API_* secrets." >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          if [[ "desktop-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match the app's version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up the toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Kept between runs, so a build only recompiles what changed.
          echo "CARGO_TARGET_DIR=$HOME/Library/Caches/beep-desktop-target" >> "$GITHUB_ENV"

      - name: Check
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build the app
        working-directory: apps/desktop/src-tauri
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Tauri runs `xattr -crs` before signing, and the pip xattr in
          # /opt/homebrew/bin has no -r.
          export PATH="/usr/bin:$PATH"
          if [[ -n "$MACOS_CERTIFICATE_P12" ]]; then
            # Tauri imports the certificate into its own keychain, signs with
            # the hardened runtime, notarizes the app and staples the ticket.
            umask 077
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notary-key.p8"
            umask 022
            export APPLE_CERTIFICATE="$MACOS_CERTIFICATE_P12"
            export APPLE_CERTIFICATE_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="Developer ID Application"
            export APPLE_API_KEY="$APPLE_API_KEY_ID"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_ID"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          fi
          cargo tauri build --bundles app

      - name: Package
        env:
          NOTARIZED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          bash scripts/package-macos-dmg.sh \
            "$CARGO_TARGET_DIR/release/bundle/macos/Beep.app" beep-macos.dmg
          if [[ "$NOTARIZED" == true ]]; then
            # The app inside is already notarized; this staples a ticket to
            # the disk image too, so opening it needs no lookup.
            xcrun notarytool submit beep-macos.dmg --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
              --wait --timeout 30m
            xcrun stapler staple beep-macos.dmg
            xcrun stapler validate beep-macos.dmg
          fi
          # Check the app as it ships, inside the disk image.
          mount="$RUNNER_TEMP/beep-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" beep-macos.dmg
          trap 'hdiutil detach "$mount" -quiet' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount/Beep.app"
          if [[ "$NOTARIZED" == true ]]; then
            xcrun stapler validate "$mount/Beep.app"
            spctl --assess --type execute --verbose=2 "$mount/Beep.app"
          fi
          shasum -a 256 beep-macos.dmg > beep-macos.dmg.sha256

      - name: Remove the notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary-key.p8"

      - uses: actions/upload-artifact@v3
        with:
          name: beep-macos
          path: |
            beep-macos.dmg
            beep-macos.dmg.sha256

      - name: Publish the release
        if: env.RELEASE == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          dmg="Beep-$VERSION.dmg"
          cp beep-macos.dmg "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          release=$(jq -n --arg tag "$GITHUB_REF_NAME" --arg name "Beep for macOS $VERSION" \
            '{tag_name: $tag, name: $name}' \
            | curl -sSf -X POST -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" --data @- "$API/releases" \
            | jq -r .id)
          for file in "$dmg" "$dmg.sha256"; do
            curl -sSf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$file" "$API/releases/$release/assets?name=$file" > /dev/null
          done
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

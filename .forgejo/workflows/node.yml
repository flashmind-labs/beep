# Releases beep-node for a `node-v<version>` tag (made by
# `just node-release <version>`). The tag must match crates/node/Cargo.toml.
#
# The host runner cross-builds the static Linux binaries (x86_64 and aarch64
# musl) in Docker with zig, the Mac runner builds aarch64-apple-darwin, and a
# last job attaches the archives and SHA256SUMS to the tag's Forgejo release
# and uploads them to the R2 bucket under beep/node/<version>/, served at
# https://releases.flashmind.com/beep/node/. latest.txt there names the newest
# version and install.sh reads it:
#
#   curl -fsSL https://releases.flashmind.com/beep/node/install.sh | sh
#
# The R2 upload is skipped until the CF_* secrets are set.
name: node

on:
  push:
    tags: ["node-v*"]

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/node/Cargo.toml | head -1)
          if [[ "node-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match beep-node's version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check install.sh
        run: docker run --rm -v "$PWD/crates/node/install.sh:/install.sh:ro" koalaman/shellcheck:v0.10.0 -s sh /install.sh

      - name: Build
        run: docker build --target node-dist --output "type=local,dest=$RUNNER_TEMP/node-bin" .

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            tar -czf "dist/beep-node-$VERSION-$target.tar.gz" -C "$RUNNER_TEMP/node-bin/$target" beep-node
          done
          rm -rf "$RUNNER_TEMP/node-bin"

      - uses: actions/upload-artifact@v3
        with:
          name: node-linux
          path: dist/*.tar.gz

  macos:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/node/Cargo.toml | head -1)
          if [[ "node-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match beep-node's version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up the toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Kept between runs, so a build only recompiles what changed.
          echo "CARGO_TARGET_DIR=$HOME/Library/Caches/beep-node-target" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          set -euo pipefail
          target=aarch64-apple-darwin
          cargo build --release --locked --package beep-node --bin beep-node --target "$target"
          mkdir -p dist
          tar -czf "dist/beep-node-$VERSION-$target.tar.gz" -C "$CARGO_TARGET_DIR/$target/release" beep-node

      - uses: actions/upload-artifact@v3
        with:
          name: node-macos
          path: dist/*.tar.gz

  publish:
    needs: [linux, macos]
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/node/Cargo.toml | head -1)
          if [[ "node-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match beep-node's version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v3
        with:
          name: node-linux
          path: dist

      - uses: actions/download-artifact@v3
        with:
          name: node-macos
          path: dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum beep-node-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(printf '{"tag_name":"%s","name":"beep-node %s"}' "$GITHUB_REF_NAME" "$VERSION" \
            | curl -sSf -X POST -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" --data @- "$API/releases" \
            | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          [[ -n "$release" ]] || { echo "No release id in the reply" >&2; exit 1; }
          for file in dist/*.tar.gz dist/SHA256SUMS; do
            name=${file##*/}
            curl -sSf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$file" "$API/releases/$release/assets?name=$name" > /dev/null
          done
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

      - name: Stage the R2 upload
        id: r2
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_ENDPOINT" ]]; then echo "No R2 secrets, skipping"; exit 0; fi
          account=${CF_ENDPOINT#https://}
          echo "account=${account%%.*}" >> "$GITHUB_OUTPUT"
          files="$RUNNER_TEMP/r2-node-files"
          pointer="$RUNNER_TEMP/r2-node-pointer"
          rm -rf "$files" "$pointer"
          mkdir -p "$files" "$pointer"
          cp dist/*.tar.gz dist/SHA256SUMS "$files/"
          cp crates/node/install.sh "$pointer/install.sh"
          printf '%s\n' "$VERSION" > "$pointer/latest.txt"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "pointer=$pointer" >> "$GITHUB_OUTPUT"

      - name: Upload the release to R2
        if: steps.r2.outputs.files != ''
        uses: https://github.com/ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ steps.r2.outputs.account }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CF_BUCKET }}
          source-dir: ${{ steps.r2.outputs.files }}
          destination-dir: beep/node/${{ env.VERSION }}

      # After the archives, so install.sh never names a version it cannot
      # fetch. Uploaded with curl rather than the action, which cannot set
      # Cache-Control: these two change with every release, so the CDN has to
      # check back each time instead of serving the last version for hours.
      - name: Point install.sh at the release
        if: steps.r2.outputs.files != ''
        env:
          ACCOUNT: ${{ steps.r2.outputs.account }}
          POINTER: ${{ steps.r2.outputs.pointer }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        run: |
          set -euo pipefail
          for name in install.sh latest.txt; do
            file="$POINTER/$name"
            curl -sSf --retry 3 --aws-sigv4 "aws:amz:auto:s3" \
              --user "$CF_ACCESS_KEY_ID:$CF_SECRET_ACCESS_KEY" \
              -H "x-amz-content-sha256: $(sha256sum "$file" | cut -d ' ' -f 1)" \
              -H "Cache-Control: no-cache" \
              -H "Content-Type: text/plain; charset=utf-8" \
              -T "$file" "https://$ACCOUNT.r2.cloudflarestorage.com/$CF_BUCKET/beep/node/$name" > /dev/null
            echo "Uploaded beep/node/$name"
          done

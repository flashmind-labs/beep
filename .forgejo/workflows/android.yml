# Builds the release APK for a tag android-vX.Y.Z (made by
# `just android-release`) and keeps it as a run artifact. With the
# PLAY_SERVICE_ACCOUNT_JSON secret it goes to Play as an app bundle: the beta
# track while X is 0, then production for a minor or major release (X.Y.0). A
# manual run goes to the internal track. The repository variable
# PLAY_BETA_TRACK picks another testing track, such as alpha for closed testing. Releases stay drafts until the
# repository variable PLAY_RELEASE_STATUS says `completed`, which Play only
# accepts once the app has been published.
#
# The server's https:// address is the repository variable BEEP_SERVER_URL.
# Signing comes from four secrets, ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them the APK is signed
# with the runner's debug key and will not install over a build signed with
# another one. GOOGLE_SERVICES_JSON, also a secret, turns on Firebase pushes.
name: android

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}" "build-tools;35.0.0"

      - name: Write signing and Firebase files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > apps/android/keystore.properties
          else
            echo "No signing secrets, using the debug key."
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          fi

      - name: Build the APK and bundle
        working-directory: apps/android
        run: >-
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          -PbeepServerUrl='${{ vars.BEEP_SERVER_URL }}'
          -PbeepVersionCode=$((100 + ${{ github.run_number }}))

      - name: Package
        run: |
          set -euo pipefail
          cp apps/android/app/build/outputs/apk/release/app-release.apk beep-android.apk
          sha256sum beep-android.apk > beep-android.apk.sha256

      - uses: actions/upload-artifact@v3
        with:
          name: beep-android
          path: |
            beep-android.apk
            beep-android.apk.sha256

      - name: Upload to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          track=internal
          if [[ "$REF" =~ ^refs/tags/android-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' apps/android/app/build.gradle.kts)
            [ "$name" = "${REF#refs/tags/android-v}" ] || { echo "Tag does not match versionName $name"; exit 1; }
            if [ "${BASH_REMATCH[1]}" != 0 ] && [ "${BASH_REMATCH[3]}" = 0 ]; then track=production; else track='${{ vars.PLAY_BETA_TRACK || 'beta' }}'; fi
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No Play service account, skipping the upload."
            exit 0
          fi
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          python3 scripts/play-upload.py "$RUNNER_TEMP/play.json" \
            apps/android/app/build/outputs/bundle/release/app-release.aab \
            "$track" '${{ vars.PLAY_RELEASE_STATUS || 'draft' }}'

      - name: Remove signing files
        if: always()
        run: rm -f apps/android/keystore.properties apps/android/app/google-services.json "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/play.json"

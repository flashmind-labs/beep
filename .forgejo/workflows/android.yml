# Builds the release APK on every push to main and keeps it as a run artifact.
#
# The server's node id is the repository variable BEEP_NODE_ID. Signing comes
# from four secrets, ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them the APK is signed
# with the runner's debug key and will not install over a build signed with
# another one. GOOGLE_SERVICES_JSON, also a secret, turns on Firebase pushes.
name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}" "build-tools;35.0.0"

      - name: Write signing and Firebase files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > apps/android/keystore.properties
          else
            echo "No signing secrets, using the debug key."
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          fi

      - name: Build the APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleRelease -PbeepNodeId='${{ vars.BEEP_NODE_ID }}'

      - name: Package
        run: |
          set -euo pipefail
          cp apps/android/app/build/outputs/apk/release/app-release.apk beep-android.apk
          sha256sum beep-android.apk > beep-android.apk.sha256

      - uses: actions/upload-artifact@v3
        with:
          name: beep-android
          path: |
            beep-android.apk
            beep-android.apk.sha256

      - name: Remove signing files
        if: always()
        run: rm -f apps/android/keystore.properties apps/android/app/google-services.json "$RUNNER_TEMP/release.keystore"

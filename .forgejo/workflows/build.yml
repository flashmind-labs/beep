# Builds the server image on every push to main and puts it in the private
# registry, tagged with the commit and `latest`. `just deploy-server` pulls it.
#
# The registry host and account are repository variables and the token a
# repository secret, so nothing about the box is written down here. `runs-on:
# host` runs on the box itself, against its docker daemon, so the cargo cache
# mounts in the Dockerfile persist between builds.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        run: |
          printf '%s' '${{ secrets.REGISTRY_TOKEN }}' \
            | docker login '${{ vars.REGISTRY }}' \
                -u '${{ vars.REGISTRY_USER }}' --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE='${{ vars.REGISTRY }}/${{ vars.REGISTRY_USER }}/beep-server'
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Log out
        if: always()
        run: docker logout '${{ vars.REGISTRY }}'

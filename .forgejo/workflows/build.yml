# Builds the server image on pushes and pull requests. Pushes to main also put
# it in the private registry, tagged with the commit and `latest`.
#
# The registry host and account are repository variables and the token a
# repository secret, so nothing about the box is written down here. `runs-on:
# host` runs on the box itself, against its docker daemon, so the cargo cache
# mounts in the Dockerfile persist between builds.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t "beep-server:${GITHUB_SHA}" .

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        run: |
          printf '%s' '${{ secrets.REGISTRY_TOKEN }}' \
            | docker login '${{ vars.REGISTRY }}' \
                -u '${{ vars.REGISTRY_USER }}' --password-stdin

      - name: Push the image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE='${{ vars.REGISTRY }}/${{ vars.REGISTRY_USER }}/beep-server'
          docker tag "beep-server:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "beep-server:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Log out
        if: always() && github.event_name != 'pull_request'
        run: docker logout '${{ vars.REGISTRY }}'

# Uploads a tag ios-vX.Y.Z (made by `just ios-release`) to TestFlight for
# invited beta testers. The phone app is the desktop Tauri app built for iOS;
# its version is "version" in apps/desktop/src-tauri/tauri.ios.conf.json and
# the workflow run number is the build number.
#
# Runs on a Mac registered with the `macos` label, with Rust, Node, Xcode and
# xcodegen installed for the runner's user. The server's https:// address is
# the repository variable BEEP_SERVER_URL.
name: ios

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos
    env:
      BEEP_SERVER_URL: ${{ vars.BEEP_SERVER_URL }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/ios-v* ]]; then
            name=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' apps/desktop/src-tauri/tauri.ios.conf.json)
            [ "$name" = "${REF#refs/tags/ios-v}" ] || { echo "Tag does not match version $name"; exit 1; }
          fi

      - name: Check configuration
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          set -euo pipefail
          for name in IOS_TEAM_ID APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID \
            IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name" >&2
              exit 1
            fi
          done
          [[ "$BEEP_SERVER_URL" =~ ^https:// ]] || {
            echo "BEEP_SERVER_URL must be the server's https:// address" >&2
            exit 1
          }
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Missing numeric build number" >&2
            exit 1
          }

      - name: Set up build tools
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v xcodegen >/dev/null || brew install xcodegen
          rustup target add aarch64-apple-ios

      - name: Prepare App Store Connect key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/ios-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/ios-api-key.p8" >> "$GITHUB_ENV"

      - name: Import distribution certificate
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          security list-keychains -d user | sed 's/^ *"//; s/"$//' > "$RUNNER_TEMP/ios-keychains.txt"
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/ios-signing.p12"
          security import "$RUNNER_TEMP/ios-signing.p12" -k "$keychain" \
            -P "$IOS_DISTRIBUTION_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          keychains=("$keychain")
          while IFS= read -r previous; do keychains+=("$previous"); done < "$RUNNER_TEMP/ios-keychains.txt"
          security list-keychains -d user -s "${keychains[@]}"

      - name: Build the web UI
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci
          npm run build

      # `tauri ios init` tries to brew-install CocoaPods and libimobiledevice,
      # which this Mac does not have and the build does not need. For init
      # only, `pod` does nothing and `brew` skips libimobiledevice and runs
      # everything else.
      - name: Generate the Xcode project
        working-directory: apps/desktop
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -d src-tauri/gen/apple ]; then exit 0; fi
          real_brew=$(command -v brew)
          shims="$RUNNER_TEMP/ios-shims"
          mkdir -p "$shims"
          printf '#!/bin/sh\nexit 0\n' > "$shims/pod"
          cat > "$shims/brew" <<SH
          #!/bin/sh
          for arg in "\$@"; do
            case "\$arg" in libimobiledevice) exit 0 ;; esac
          done
          exec "$real_brew" "\$@"
          SH
          chmod +x "$shims/pod" "$shims/brew"
          PATH="$shims:$PATH" npm run tauri -- ios init --ci

      - name: Build the IPA
        working-directory: apps/desktop
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.IOS_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          npm run tauri -- ios build --export-method app-store-connect \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa=$(find apps/desktop/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "No IPA was built" >&2; exit 1; }
          xcrun altool --upload-app -f "$ipa" -t ios \
            --api-key "$APPLE_API_KEY_ID" --api-issuer "$APPLE_API_ISSUER_ID" \
            --p8-file-path "$APPLE_API_KEY_PATH"

      - name: Remove signing assets
        if: always()
        run: |
          # Drop only this job's keychain. Restoring the list saved at the
          # start would also drop one another job on this Mac added since.
          keychains=()
          while IFS= read -r current; do
            [[ "$current" == */ios-signing.keychain-db ]] || keychains+=("$current")
          done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "${keychains[@]}"
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/ios-api-key.p8" "$RUNNER_TEMP/ios-signing.p12" \
            "$RUNNER_TEMP/ios-keychains.txt" "$RUNNER_TEMP/ios-shims"

# Uploads each main build to TestFlight for invited beta testers.
name: ios

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos
    env:
      BEEP_NODE_ID: ${{ vars.BEEP_NODE_ID }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          for name in IOS_TEAM_ID APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID \
            IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_PASSWORD IOS_PROVISIONING_PROFILE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name" >&2
              exit 1
            fi
          done
          [[ "$BEEP_NODE_ID" =~ ^[0-9a-f]{64}$ ]] || {
            echo "BEEP_NODE_ID must be 64 lowercase hexadecimal characters" >&2
            exit 1
          }
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Missing numeric build number" >&2
            exit 1
          }

      - name: Set up build tools
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v xcodegen >/dev/null || brew install xcodegen
          rustup target add aarch64-apple-ios

      - name: Prepare App Store Connect key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/ios-api-key.p8"
          echo "IOS_API_KEY_PATH=$RUNNER_TEMP/ios-api-key.p8" >> "$GITHUB_ENV"

      - name: Import distribution signing assets
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          security list-keychains -d user | sed 's/^ *"//; s/"$//' > "$RUNNER_TEMP/ios-keychains.txt"
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/ios-signing.p12"
          security import "$RUNNER_TEMP/ios-signing.p12" -k "$keychain" \
            -P "$IOS_DISTRIBUTION_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          keychains=("$keychain")
          while IFS= read -r previous; do keychains+=("$previous"); done < "$RUNNER_TEMP/ios-keychains.txt"
          security list-keychains -d user -s "${keychains[@]}"

          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/ios-profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/ios-profile.mobileprovision" | plutil -extract UUID raw -o - -)
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          profile_path="$profile_dir/$uuid.mobileprovision"
          printf '%s' "$profile_path" > "$RUNNER_TEMP/ios-profile-path"
          install -m 600 "$RUNNER_TEMP/ios-profile.mobileprovision" "$profile_path"
          echo "IOS_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Build and archive
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          bash apps/ios/scripts/build-rust.sh device
          cd apps/ios
          xcodegen generate --quiet
          xcodebuild -project Beep.xcodeproj -scheme Beep -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Beep.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$IOS_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive

      - name: Export and upload
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IOS_EXPORT_OPTIONS="$RUNNER_TEMP/ios-export-options.plist" python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": "app-store-connect",
              "destination": "export",
              # Automatic, so the widget extension gets its own App Store
              # profile next to the app's.
              "signingStyle": "automatic",
              "signingCertificate": "Apple Distribution",
              "teamID": os.environ["IOS_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
          }
          with open(os.environ["IOS_EXPORT_OPTIONS"], "wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Beep.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ios-export-options.plist" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -allowProvisioningUpdates -authenticationKeyPath "$IOS_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          xcrun altool --upload-app -f "$RUNNER_TEMP/ios-export/Beep.ipa" -t ios \
            --api-key "$APPLE_API_KEY_ID" --api-issuer "$APPLE_API_ISSUER_ID" \
            --p8-file-path "$IOS_API_KEY_PATH"

      - name: Remove signing assets
        if: always()
        run: |
          # Drop only this job's keychain. Restoring the list saved at the
          # start would also drop one another job on this Mac added since.
          keychains=()
          while IFS= read -r current; do
            [[ "$current" == */ios-signing.keychain-db ]] || keychains+=("$current")
          done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "${keychains[@]}"
          if [[ -f "$RUNNER_TEMP/ios-profile-path" ]]; then
            rm -f "$(cat "$RUNNER_TEMP/ios-profile-path")"
          fi
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/ios-api-key.p8" "$RUNNER_TEMP/ios-export-options.plist" \
            "$RUNNER_TEMP/ios-signing.p12" "$RUNNER_TEMP/ios-profile.mobileprovision" \
            "$RUNNER_TEMP/ios-profile-path" "$RUNNER_TEMP/ios-keychains.txt"

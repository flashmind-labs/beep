# beep-server on one Docker host. Copy config.example.toml to
# deploy/config.toml, set http_listen = "0.0.0.0:47122" and [reports.r2], then:
#
#   docker compose -f deploy/compose.yaml up -d
name: beep
services:
  server:
    # Built from this repository unless BEEP_SERVER_IMAGE names one you pull.
    image: ${BEEP_SERVER_IMAGE:-beep-server:local}
    build:
      context: ..
    restart: unless-stopped
    command: ["/etc/beep/config.toml"]
    ports:
      # Loopback only. A tunnel or a reverse proxy with TLS in front of it is up to you.
      - "127.0.0.1:47122:47122"
    volumes:
      - ./config.toml:/etc/beep/config.toml:ro
      # Logs.
      - data:/data

volumes:
  data:

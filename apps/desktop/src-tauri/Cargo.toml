[package]
name = "beep-desktop"
version = "0.9.25"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Beep desktop: projects, coding agents and a quick-access tray bar"
publish.workspace = true

[lib]
name = "beep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[features]
default = []
full = ["local-host", "rich-text", "metrics-recording", "resource-profiling", "autostart", "window-state", "image-clipboard", "image-thumbnails", "desktop-control", "asset-compression", "blob-cache", "plugin-tools"]
local-host = ["beep-node/host", "metrics-recording"]
rich-text = ["dep:ammonia", "dep:pulldown-cmark", "dep:pulldown-latex"]
metrics-recording = ["dep:metrics-exporter-prometheus"]
autostart = ["dep:tauri-plugin-autostart"]
window-state = ["dep:tauri-plugin-window-state"]
image-clipboard = ["dep:arboard", "dep:image"]
image-thumbnails = ["beep-mesh/thumbs"]
desktop-control = ["local-host", "dep:objc2-application-services", "dep:objc2-screen-capture-kit"]
asset-compression = ["tauri/compression"]
blob-cache = ["dep:iroh-blobs"]
plugin-tools = ["beep-plugins/tools"]
# Battery and process sampling, enabled at runtime by BEEP_DESKTOP_RESOURCE_METRICS.
resource-profiling = ["metrics-recording", "dep:battery", "dep:sysinfo"]
# Sparkle updates, for the signed builds of the release workflow.
sparkle = ["dep:tauri-plugin-sparkle-updater"]

[dependencies]
ammonia = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
beep-fleet.workspace = true
beep-mesh.workspace = true
beep-node.workspace = true
beep-projects.workspace = true
beep-proto = { workspace = true, features = ["https"] }
beep-report.workspace = true
futures.workspace = true
iroh.workspace = true
iroh-blobs = { workspace = true, optional = true }
iroh-metrics.workspace = true
iroh-tickets.workspace = true
log.workspace = true
metrics.workspace = true
# Renders the metrics a phone keeps itself; a desktop's embedded node uses it too.
metrics-exporter-prometheus = { workspace = true, optional = true }
open.workspace = true
percent-encoding.workspace = true
pulldown-cmark = { workspace = true, features = ["html"], optional = true }
pulldown-cmark-escape.workspace = true
pulldown-latex = { workspace = true, optional = true }
qrcode = { workspace = true, features = ["svg"] }
regex.workspace = true
rusqlite.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
strum.workspace = true
tauri = { workspace = true, features = ["wry", "dynamic-acl", "tray-icon", "macos-private-api"] }
tauri-plugin-opener.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, default-features = false, features = ["fmt", "env-filter", "tracing-log", "smallvec"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
which.workspace = true

[dev-dependencies]
rmp-serde.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# Desktop only: no login item or self-updater on a phone, and no embedded node.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { workspace = true, optional = true }
battery = { workspace = true, optional = true }
beep-mesh.workspace = true
beep-node.workspace = true
beep-plugins = { workspace = true, default-features = false }
# The app data folder before Tauri starts, as Tauri finds it.
dirs.workspace = true
image = { workspace = true, features = ["png"], optional = true }
sysinfo = { workspace = true, features = ["system"], optional = true }
# macos-private-api is repeated here because the Tauri CLI checks this entry.
tauri = { workspace = true, default-features = false, features = ["macos-private-api", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-autostart = { workspace = true, optional = true }
tauri-plugin-window-state = { workspace = true, optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification.workspace = true

# A board lane ticks as it settles on a card.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ammonia.workspace = true
iroh-blobs.workspace = true
metrics-exporter-prometheus.workspace = true
pulldown-cmark = { workspace = true, features = ["html"] }
pulldown-latex.workspace = true
tauri-plugin-haptics.workspace = true

# Android scans the pairing QR code with zxing's capture screen.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-qr-scan.workspace = true

# The iPhone keeps its key in the Keychain.
[target.'cfg(target_os = "ios")'.dependencies]
# The camera scans the pairing QR code.
tauri-plugin-barcode-scanner.workspace = true
security-framework.workspace = true
# Removes the web view's bar above the keyboard.
objc2.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
webview2-com.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The native updater, only in release builds (`sparkle`): it links Sparkle.framework,
# which a local build signed ad hoc cannot load under the hardened runtime.
tauri-plugin-sparkle-updater = { workspace = true, optional = true }
block2.workspace = true
# When the kernel started the process, for the startup timings in the log.
libc.workspace = true
# The application identity hook for notifications in unbundled development builds.
mac-notification-sys.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "libc", "NSEvent", "NSBitmapImageRep", "NSImageRep", "NSRunningApplication", "NSWorkspace", "NSGraphics", "NSResponder", "NSWindow", "block2", "objc2-core-graphics"] }
# Desktop control: the accessibility tree and Accessibility permission.
objc2-application-services = { workspace = true, optional = true, features = ["std", "HIServices", "libc", "AXUIElement", "AXValue", "AXError"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGSession", "CGWindow"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSValue", "NSData", "NSNotification", "NSOperation", "NSURL", "NSUserNotification", "block2"] }
# Desktop control: screenshots.
objc2-screen-capture-kit = { workspace = true, optional = true, features = ["std", "block2", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }

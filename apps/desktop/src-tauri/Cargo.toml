[package]
name = "beep-desktop"
version = "0.6.1"
edition = "2024"
rust-version = "1.93"
description = "Beep desktop: projects, coding agents and a quick-access tray bar"
publish = false

# Its own workspace, so the server's Docker build and Linux checks never see Tauri.
[workspace]

[lib]
name = "beep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
which = "8"
async-trait = "0.1"
ammonia = "4"
base64 = "0.22"
beep-fleet = { path = "../../../crates/fleet" }
beep-live = { path = "../../../crates/live" }
beep-mesh = { path = "../../../crates/mesh" }
beep-node = { path = "../../../crates/node", default-features = false }
metrics = "0.24"
beep-projects = { path = "../../../crates/projects" }
beep-proto = { path = "../../../crates/proto", features = ["client"] }
beep-report = { path = "../../../crates/report" }
futures = "0.3"
iroh = "1.3"
iroh-tickets = "1"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
thiserror = "2"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
pulldown-latex = "0.8"

[dev-dependencies]
rmp-serde = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

# Desktop only: no login item or self-updater on a phone, and no embedded node.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
beep-node = { path = "../../../crates/node", default-features = false, features = ["host"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

# Phone only: the camera scans the pairing QR code.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# The iPhone keeps its key in the Keychain.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"
# Removes the web view's bar above the keyboard.
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
# Notifications with Allow and Deny, and what a click on one opens. The
# notification plugin shows them through the same crate but drops actions.
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSBitmapImageRep", "NSImageRep", "NSRunningApplication", "NSWorkspace", "block2", "objc2-core-graphics"] }
# Desktop control: the accessibility tree and Accessibility permission.
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "libc", "AXUIElement", "AXValue", "AXError"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGSession", "CGWindow"] }
# Live mode: asking for the microphone before the engine opens it.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
# Live mode: microphone with echo cancellation, and the player, in one engine.
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioBuffer", "AVAudioEngine", "AVAudioFile", "AVAudioFormat", "AVAudioIONode", "AVAudioMixerNode", "AVAudioNode", "AVAudioPlayerNode", "AVAudioTime", "AVAudioTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSValue", "NSData", "NSOperation", "NSURL"] }
# Desktop control: screenshots.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }

[profile.release]
strip = true

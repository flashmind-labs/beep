[package]
name = "beep-desktop"
version = "0.10.43"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Beep desktop: projects, coding agents and a quick-access tray bar"
publish.workspace = true

[lib]
name = "beep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc.workspace = true
tauri-build.workspace = true

[features]
# The signed macOS release links Sparkle.framework; local builds use ad hoc signing.
sparkle = ["dep:tauri-plugin-sparkle-updater"]

[dependencies]
ammonia = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
beep-fleet.workspace = true
beep-mesh.workspace = true
beep-node.workspace = true
beep-projects.workspace = true
beep-proto = { workspace = true, features = ["https"] }
beep-report.workspace = true
futures.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
iroh-metrics.workspace = true
iroh-tickets.workspace = true
log.workspace = true
metrics.workspace = true
# Renders the metrics a phone keeps itself; a desktop's embedded node uses it too.
metrics-exporter-prometheus = { workspace = true }
open.workspace = true
percent-encoding.workspace = true
pulldown-cmark = { workspace = true, features = ["html"] }
pulldown-latex = { workspace = true }
qrcode = { workspace = true, features = ["svg"] }
regex.workspace = true
rusqlite.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
strum.workspace = true
tauri = { workspace = true, features = ["wry", "dynamic-acl", "tray-icon", "macos-private-api", "compression"] }
tauri-plugin-opener.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, default-features = false, features = ["fmt", "env-filter", "tracing-log", "smallvec"] }
url.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
which.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
yawc.workspace = true
rmp-serde.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# Desktop only: no login item or self-updater on a phone, and no embedded node.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { workspace = true }
battery = { workspace = true }
beep-mesh = { workspace = true, features = ["thumbs"] }
beep-node = { workspace = true, features = ["host"] }
beep-plugins.workspace = true
bytes.workspace = true
# The app data folder before Tauri starts, as Tauri finds it.
dirs.workspace = true
flashmind-llm.workspace = true
hex.workspace = true
image = { workspace = true, features = ["png"] }
reqwest.workspace = true
sha2.workspace = true
sysinfo = { workspace = true, features = ["system"] }
# macos-private-api is repeated here because the Tauri CLI checks this entry.
tauri = { workspace = true, default-features = false, features = ["macos-private-api", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-window-state = { workspace = true }
transcribe-cpp.workspace = true

[target.'cfg(not(any(target_os = "macos", target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification.workspace = true

# A board lane ticks as it settles on a card.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics.workspace = true

# Android scans the pairing QR code with zxing's capture screen.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-qr-scan.workspace = true

# The iPhone keeps its key in the Keychain.
[target.'cfg(target_os = "ios")'.dependencies]
# The camera scans the pairing QR code.
tauri-plugin-barcode-scanner.workspace = true
security-framework.workspace = true
# Removes the web view's bar above the keyboard.
objc2.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gdkx11.workspace = true
gtk.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Media_Control", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
windows-core.workspace = true
winreg.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
webview2-com.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Match the code generators' Serde build, including its default feature marker.
serde_core.workspace = true
# The native updater, only in release builds (`sparkle`): it links Sparkle.framework,
# which a local build signed ad hoc cannot load under the hardened runtime.
tauri-plugin-sparkle-updater = { workspace = true, optional = true }
block2.workspace = true
# When the kernel started the process, for the startup timings in the log.
libc.workspace = true
# The application identity hook for notifications in unbundled development builds.
mac-notification-sys.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "libc", "NSEvent", "NSBitmapImageRep", "NSImageRep", "NSRunningApplication", "NSWorkspace", "NSGraphics", "NSResponder", "NSWindow", "block2", "objc2-core-graphics"] }
# Desktop control: the accessibility tree and Accessibility permission.
objc2-application-services = { workspace = true, features = ["std", "HIServices", "libc", "AXUIElement", "AXValue", "AXError"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGSession", "CGWindow"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSValue", "NSData", "NSNotification", "NSOperation", "NSURL", "NSUserNotification", "block2"] }
# Desktop control: screenshots.
objc2-screen-capture-kit = { workspace = true, features = ["std", "block2", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
# Match the runtime features so native builds compile these libraries once.
libc = { workspace = true, features = ["extra_traits"] }
log = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["rc"] }

[package.metadata.cargo-machete]
# This dependency aligns features with the code generators.
ignored = ["serde_core"]

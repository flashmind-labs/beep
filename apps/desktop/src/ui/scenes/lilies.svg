    <path stroke="#3a6262" stroke-width="7" d="M160 365 Q800 122 1440 365" />
    <path stroke="#80aa9a" stroke-width="4" d="M160 302 Q800 59 1440 302" />
    <path stroke="#80aa9a" stroke-width="3" d="M160 302V365M240 273V336M320 248V311M400 227V290M480 210V273M560 197V260M640 188V251M720 182V245M800 180V243M880 182V245M960 188V251M1040 197V260M1120 210V273M1200 227V290M1280 248V311M1360 273V336M1440 302V365" />
    <g stroke="none">

<!-- The lily pond under its footbridge, after Monet. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-level="0.43">
  <defs>
    <pattern id="willow" width="72" height="900" patternUnits="userSpaceOnUse">
      <rect x="10" width="16" height="900" fill="#8e9658" />
    </pattern>
    <pattern id="reflected" width="214" height="900" patternUnits="userSpaceOnUse">
      <rect x="20" width="70" height="900" fill="#325846" />
    </pattern>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3c44" />
      <stop offset="1" stop-color="#22404c" />
    </linearGradient>
    <linearGradient id="skyInPond" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c6c8e" stop-opacity="0.2" />
      <stop offset="0.14" stop-color="#5c6c8e" stop-opacity="0.6" />
      <stop offset="0.4" stop-color="#5c6c8e" stop-opacity="0.15" />
      <stop offset="0.6" stop-color="#5c6c8e" stop-opacity="0" />
      <stop offset="0.85" stop-color="#5c6c8e" stop-opacity="0.15" />
      <stop offset="1" stop-color="#5c6c8e" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="deeper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Trees and willow behind the bridge. -->
  <rect width="1600" height="387" fill="#1a322c" />
  <g fill="#5c7e50" opacity="0.45">
    <ellipse cx="120" cy="80" rx="140" ry="60" />
    <ellipse cx="420" cy="190" rx="120" ry="50" />
    <ellipse cx="700" cy="60" rx="160" ry="45" />
    <ellipse cx="980" cy="160" rx="130" ry="60" />
    <ellipse cx="1260" cy="70" rx="150" ry="50" />
    <ellipse cx="1500" cy="220" rx="120" ry="55" />
    <ellipse cx="260" cy="320" rx="110" ry="40" />
    <ellipse cx="1120" cy="320" rx="120" ry="40" />
  </g>
  <rect class="glint" width="1600" height="387" fill="url(#willow)" opacity="0.6" />

  <!-- The pond, with the trees and the sky standing in it, and drifts of pads. -->
  <rect y="387" width="1600" height="513" fill="url(#pond)" />
  <rect class="glint" y="387" width="1600" height="513" fill="url(#reflected)" opacity="0.6" />
  <rect y="387" width="1600" height="513" fill="url(#skyInPond)" />
  <rect y="387" width="1600" height="200" fill="url(#deeper)" />
  <g fill="#4e7e60">
    <ellipse cx="183" cy="433" rx="30" ry="10" />
    <ellipse cx="271" cy="454" rx="32" ry="10" />

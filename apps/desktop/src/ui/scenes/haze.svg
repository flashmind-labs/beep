<!-- The dawn haze: the sunrise's sky alone, warm in its top corner. It stretches to any shape
     (`preserveAspectRatio="none"`), from the sidebar to a band along the top of a page. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" preserveAspectRatio="none" data-level="1">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c7886" />
      <stop offset="0.45" stop-color="#5e6476" />
      <stop offset="0.83" stop-color="#32405c" />
      <stop offset="1" stop-color="#32405c" />
    </linearGradient>
    <radialGradient id="corner" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse" gradientTransform="scale(1 0.3125)">
      <stop offset="0" stop-color="#de845c" stop-opacity="0.8" />
      <stop offset="0.5" stop-color="#de845c" stop-opacity="0.47" />
      <stop offset="1" stop-color="#de845c" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <rect width="100" height="100" fill="url(#sky)" />
  <rect width="100" height="100" fill="url(#corner)" />
</svg>

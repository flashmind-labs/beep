<!doctype html>
<html lang="en">
<head>

<body class="cbody">
<div class="cwin" role="main" aria-label="Beep">
  <aside class="cc-side" id="side"></aside>
  <div class="cc-grip" id="side-grip" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" tabindex="0"></div>
  <div class="cc-main" id="main">
    <div class="cc-top" data-tauri-drag-region><h2 data-tauri-drag-region id="title">Home</h2><span id="scope"></span><small id="date" data-tauri-drag-region></small><span class="tools" id="tools"></span><span id="usage" hidden></span><span id="bell"></span></div>
    <div class="cc-box" id="home-box">
      <div class="cc-view" id="view"></div>
    </div>
    <div class="cc-box" id="pane-box" hidden><div id="bar" class="dbar" data-mode="window" aria-label="Chat"></div></div>
  </div>

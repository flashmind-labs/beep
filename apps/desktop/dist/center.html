<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beep</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="math.css">
<link rel="stylesheet" href="center.css">
</head>
<body class="cbody">
<div class="cwin" role="main" aria-label="Beep">
  <aside class="cc-side" id="side"></aside>
  <div class="cc-main" id="main">
    <div class="cc-top" data-tauri-drag-region><h2 data-tauri-drag-region id="title">Home</h2><small id="date" data-tauri-drag-region></small><span class="tools" id="tools"></span></div>
    <div class="cc-box" id="home-box">
      <div class="cc-view" id="view"></div>
      <form class="cc-comp" id="home-comp"><input id="home-ask" type="text" autocomplete="off" spellcheck="false" aria-label="Ask Beep" placeholder="Ask Beep anything"><span class="cc-err" id="home-err" role="status"></span><button class="dbtn pri" type="submit">Send<kbd>&#9166;</kbd></button></form>
    </div>
    <div class="cc-box" id="pane-box" hidden><div id="bar" class="dbar" data-mode="window" aria-label="Chat"></div></div>
  </div>
</div>
<script src="app.js"></script>
<script type="module" src="center.js"></script>
</body>
</html>

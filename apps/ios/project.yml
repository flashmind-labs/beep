name: Beep
options:
  bundleIdPrefix: com.flashmind
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Beep:
    type: application
    platform: iOS
    dependencies:
      - target: BeepWidget
      - target: BeepNotifications
    sources:
      - path: Beep
      - path: Generated
        excludes: ["*.h", "module.modulemap"]
      - path: ../android/app/src/main/res/font/bricolage_grotesque.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/rubik.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/fredoka.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/nunito.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/sniglet_regular.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/sniglet_extrabold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashmind.beep
        # The avatars other than the pager, picked in Settings.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Clay AppIcon-Jelly
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beep
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Beep uses your location for nearby places, weather and directions.
        INFOPLIST_KEY_NSContactsUsageDescription: Beep looks up a contact when you ask it to.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Beep watches the places you saved, so a routine can start when you arrive or leave.
        INFOPLIST_KEY_NSCameraUsageDescription: Beep uses the camera to scan a Beep code, and while it's open in a chat to send a photo with your message.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Beep listens when you tap the mic, to write your message from what you say.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Beep turns what you say into text for your message.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Beep shows your recent photos so you can send one with a message.
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lbeep_android -framework SystemConfiguration -framework Security
        CODE_SIGN_STYLE: Automatic
    info:
      path: Beep/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [bricolage_grotesque.ttf, rubik.ttf, fredoka.ttf, nunito.ttf, sniglet_regular.ttf, sniglet_extrabold.ttf]
        NSUserActivityTypes: [INSendMessageIntent]
        # The ride apps a place card can open with the drop-off set.
        LSApplicationQueriesSchemes: [comgooglemaps, grab, lyft, uber]
        NSAlarmKitUsageDescription: Beep sets alarms in the Clock when you ask it to.
        # A background push wakes the app to fetch notices the server could not send.
        UIBackgroundModes: [remote-notification]
        # beep://new, from the widget.
        CFBundleURLTypes:
          - CFBundleURLName: com.flashmind.beep
            CFBundleURLSchemes: [beep]
    entitlements:
      path: Beep/Beep.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.communication: true
        # Shared with the notification extension, which opens pushes with the account key.
        keychain-access-groups: [$(AppIdentifierPrefix)com.flashmind.beep]
  BeepWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: ../android/app/src/main/res/font/bricolage_grotesque.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/rubik.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashmind.beep.widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beep
        CODE_SIGN_STYLE: Automatic
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [bricolage_grotesque.ttf, rubik.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BeepNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: Notifications
        excludes: ["*.entitlements"]
      - path: Beep/Identity.swift
      - path: Beep/NoticeAlert.swift
      - path: Generated
        excludes: ["*.h", "module.modulemap"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashmind.beep.notifications
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beep
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lbeep_android -framework SystemConfiguration -framework Security -framework Network
        CODE_SIGN_STYLE: Automatic
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notifications/BeepNotifications.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.flashmind.beep]

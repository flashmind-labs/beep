name: Beep
options:
  bundleIdPrefix: com.flashmind
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Beep:
    type: application
    platform: iOS
    sources:
      - path: Beep
      - path: Generated
        excludes: ["*.h", "module.modulemap"]
      - path: ../android/app/src/main/res/font/bricolage_grotesque.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/rubik.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashmind.beep
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beep
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Beep uses your location for nearby places, weather and directions.
        INFOPLIST_KEY_NSContactsUsageDescription: Beep looks up a contact when you ask it to.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Beep watches the places you saved, so a routine can start when you arrive or leave.
        INFOPLIST_KEY_NSCameraUsageDescription: Beep uses the camera while it's open in a chat, to send a photo with your message.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Beep shows your recent photos so you can send one with a message.
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lbeep_android -framework SystemConfiguration -framework Security
        CODE_SIGN_STYLE: Automatic
    info:
      path: Beep/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [bricolage_grotesque.ttf, rubik.ttf]
        NSUserActivityTypes: [INSendMessageIntent]
    entitlements:
      path: Beep/Beep.entitlements
      properties:
        com.apple.developer.usernotifications.communication: true

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>Diagram</title>
<style>
:root{color-scheme:light dark;font:14px/20px system-ui,sans-serif;background:transparent;color:light-dark(#242b37,#eee)}
*{box-sizing:border-box}body{margin:0}main{border:1px solid #8885;border-radius:8px;overflow:hidden}
nav{display:flex;align-items:center;gap:4px;padding:8px;flex-wrap:wrap}button{font:inherit;font-weight:600;border:0;border-radius:4px;padding:8px 12px;background:light-dark(#eee,#272727);color:inherit;cursor:pointer}
button:hover{background:light-dark(#ddd,#313131)}button:active{transform:scale(.98)}button:focus-visible{outline:2px solid #648ac8;outline-offset:2px}button:disabled{opacity:.5;cursor:default}
[hidden]{display:none!important}#stage{overflow:auto;background:#fff;touch-action:pan-x pan-y pinch-zoom;cursor:zoom-in}#picture{display:block;width:100%;height:220px;object-fit:scale-down;user-select:none;-webkit-user-drag:none}
pre{margin:0;padding:16px;overflow:auto;white-space:pre;font:12px/16px ui-monospace,monospace;background:light-dark(#f4f4f4,#1f1f1f);max-height:320px}
#status{margin:0;padding:8px 16px;font-size:12px;line-height:16px}#status:empty{display:none}.zoom{display:none}
body.expanded main{height:100dvh;border:0;border-radius:0;display:flex;flex-direction:column}body.expanded #stage{flex:1;cursor:grab;min-height:0}body.expanded #picture{height:auto;max-width:none}body.expanded .zoom{display:inline-block}body.expanded pre{flex:1;max-height:none}
#menu{position:fixed;z-index:10;min-width:200px;display:grid;padding:4px;border:1px solid #8885;border-radius:8px;background:light-dark(#fff,#181818);box-shadow:0 8px 24px #0004}#menu button{text-align:left;background:transparent}#menu button:hover,#menu button:focus-visible{background:light-dark(#eee,#313131)}
</style>
<script src="renderer.js" defer></script>
</head>
<body>
<main aria-label="Mermaid diagram">
<nav aria-label="Diagram controls">
<button id="expand">Expand</button><button id="source" aria-pressed="false">Source</button><button id="copy-image" disabled>Copy image</button><button id="copy">Copy source</button><button id="svg" disabled>SVG</button><button id="png" disabled>PNG</button>
<button class="zoom" id="out" aria-label="Zoom out">-</button><button class="zoom" id="in" aria-label="Zoom in">+</button><button class="zoom" id="fit">Fit</button>
</nav>
<p id="status" role="status">Loading diagram...</p>
<div id="stage" hidden><img id="picture" alt="Mermaid diagram" draggable="false"></div>
<pre id="code" hidden></pre>
</main>
<div id="menu" role="menu" aria-label="Image actions" hidden>
<button role="menuitem" data-image-action="copy">Copy image</button>
<button role="menuitem" data-image-action="save">Save image</button>
<button role="menuitem" data-image-action="svg">Save as SVG</button>
<button role="menuitem" data-image-action="source">Copy source</button>
</div>
</body>
</html>

[workspace]
resolver = "3"
members = ["crates/proto", "crates/projects", "crates/server", "crates/node", "crates/live", "crates/mesh", "crates/fleet", "crates/report"]

[profile.release]
strip = true

# Line numbers for our crates and no debug info for dependencies: links
# faster and keeps target/ small. Backtraces still name our lines.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

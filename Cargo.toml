[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/fleet",
    "crates/mesh",
    "crates/node",
    "crates/plugins",
    "crates/projects",
    "crates/proto",
    "crates/report",
    "crates/server",
]
# A bare `cargo build`, `clippy` or `test` leaves the Tauri app out: it needs
# the platform's web view libraries. Name it with `-p beep-desktop`.
default-members = [
    "crates/fleet",
    "crates/mesh",
    "crates/node",
    "crates/plugins",
    "crates/projects",
    "crates/proto",
    "crates/report",
    "crates/server",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99"
publish = false

# One version for every crate. Entries carry the features all users share;
# a crate adds its own with `features = [...]`.
[workspace.dependencies]
beep-fleet = { path = "crates/fleet" }
beep-mesh = { path = "crates/mesh" }
# The phone leaves out the host; a node and the desktop turn it on.
beep-node = { path = "crates/node", default-features = false }
beep-plugins = { path = "crates/plugins" }
beep-projects = { path = "crates/projects" }
beep-proto = { path = "crates/proto" }
beep-report = { path = "crates/report" }

agent-client-protocol = "5.5"
ammonia = "4"
anyhow = "1"
arboard = "3.7"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
bao-tree = "0.17"
base64 = "0.23"
battery = "0.7"
blake3 = "1"
block2 = "0.6"
bytes = "1"
cc = "1"
chrono = "0.4"
clap = "4"
cpu-time = "1.0.0"
crc32fast = "1"
diffy = "0.5"
dirs = "7"
dunce = "1"
fastrand = "2"
flashmind-tools = { version = "0.3.8", default-features = false }
flashmind-llm = { version = "0.3.8", default-features = false, features = ["elevenlabs-realtime", "mistral-realtime"] }
flashmind-types = "0.3.5"
flate2 = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
gdkx11 = "0.18"
gtk = "0.18"
gix = { version = "0.90", default-features = false }
gix-revision = { version = "0.52", default-features = false, features = ["merge_base"] }
hex = "0.4"
humantime = "2"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
ignore = "0.4"
image = { version = "0.25", default-features = false }
# Lean for the phone; a node turns on the defaults.
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring", "fast-apple-datapath", "metrics", "unstable-net-report"] }
iroh-base = { version = "1.5.0", default-features = false }
iroh-blobs = { version = "0.105", default-features = false, features = ["fs-store"] }
iroh-metrics = "1"
iroh-tickets = "1"
irpc = { version = "1", default-features = false }
jsonschema = { version = "0.61.2", default-features = false }
libc = "0.2"
log = "0.4"
mac-notification-sys = "0.6"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
mime_guess = { version = "2", default-features = false }
n0-error = "1.0.3"
notify = "8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-application-services = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-screen-capture-kit = { version = "0.3", default-features = false }
open = "5"
percent-encoding = "2"
portable-pty = "0.9"
prost = "0.14"
protox = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-latex = "0.8"
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13.5", default-features = false }
rmp = "0.8"
rmp-serde = "1"
roxmltree = "0.21"
rquickjs = "0.14"
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "functions"] }
rust-ini = "0.21"
rust_decimal = "1"
rustix = "1"
rustls = { version = "0.23", default-features = false }
rusty-s3 = "0.11"
secrecy = "0.10"
security-framework = "3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_core = "1"
serde_bytes = "0.11"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
shlex = "2"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
sysinfo = { version = "0.40", default-features = false }
tar = { version = "0.4", default-features = false }
tauri = { version = "2", default-features = false }
tauri-build = "2"
tauri-plugin-autostart = "2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-qr-scan = { path = "apps/desktop/src-tauri/qr-scan" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-haptics = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sparkle-updater = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-io-timeout = "1.2.1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
toml_edit = "0.25"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false, features = ["cleanup-markdown"] }
tower = "0.5"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-log = { version = "0.2", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std"] }
transcribe-cpp = "0.4.2"
url = "2"
uuid = "1"
webpki-roots = "1"
webview2-com = "0.39"
which = "8"
windows = "0.62"
windows-core = "0.62"
winreg = "0.56"
windows-sys = "0.61"
yawc = { version = "0.5", default-features = false }
zbus = "6"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
strip = true

# Line numbers for our crates and no debug info for dependencies: links
# faster and keeps target/ small. Backtraces still name our lines.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Git reads decode packs and walk history on every scan: unoptimized, a
# debug build spends seconds of CPU in them.
[profile.dev.package.gix-pack]
opt-level = 3

[profile.dev.package.gix-odb]
opt-level = 3

[profile.dev.package.gix-object]
opt-level = 3

[profile.dev.package.gix-hash]
opt-level = 3

[profile.dev.package.gix-ref]
opt-level = 3

[profile.dev.package.gix-revwalk]
opt-level = 3

[profile.dev.package.gix-commitgraph]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

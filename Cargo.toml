[workspace]
resolver = "3"
members = ["crates/proto", "crates/projects", "crates/server", "crates/node", "crates/mesh", "crates/fleet", "crates/report", "crates/plugins"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99"
publish = false

# One version for every crate. Entries carry the features all users share;
# a crate adds its own with `features = [...]`.
[workspace.dependencies]
beep-mesh = { path = "crates/mesh" }
beep-node = { path = "crates/node" }
beep-projects = { path = "crates/projects" }
beep-proto = { path = "crates/proto" }
beep-report = { path = "crates/report" }

agent-client-protocol = "5.2"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bao-tree = "0.17"
base64 = "0.23"
blake3 = "1"
bytes = "1"
chrono = "0.4"
clap = "4"
cpu-time = "1.0.0"
crc32fast = "1"
dirs = "7"
dunce = "1"
fastrand = "2"
flashmind-tools = { version = "0.3.6", default-features = false }
flashmind-types = "0.3.2"
flate2 = "1"
futures = "0.3"
gix = { version = "0.90", default-features = false }
hex = "0.4"
humantime = "2"
hyper-util = "0.1"
ignore = "0.4"
image = { version = "0.25", default-features = false }
# Lean for the phone; a node turns on the defaults.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-base = { version = "1.4.1", default-features = false }
iroh-blobs = { version = "0.105", default-features = false, features = ["fs-store"] }
iroh-metrics = "1"
iroh-tickets = "1"
jsonschema = { version = "0.61.2", default-features = false }
libc = "0.2"
log = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
mime_guess = "2"
notify = "8"
oxc = "0.158"
portable-pty = "0.9"
prost = "0.14"
protox = "0.10"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13.5", default-features = false }
rmp = "0.8"
rmp-serde = "1"
roxmltree = "0.21"
rquickjs = "0.14"
rusqlite = { version = "0.42", features = ["bundled"] }
rust-ini = "0.21"
rustix = "1"
rustls = { version = "0.23", default-features = false }
rusty-s3 = "0.11"
secrecy = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
shlex = "2"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-io-timeout = "1.2.1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
toml_edit = "0.25"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-log = { version = "0.2", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
uuid = "1"
webpki-roots = "1"
which = "8"
windows-sys = "0.61"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
strip = true

# Line numbers for our crates and no debug info for dependencies: links
# faster and keeps target/ small. Backtraces still name our lines.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

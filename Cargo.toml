[workspace]
resolver = "3"
members = ["crates/proto", "crates/projects", "crates/server", "crates/android-bridge", "crates/node", "crates/live", "crates/mesh"]

[profile.release]
strip = true

# Size-tuned build for the Android native library. Keeps the default strip:
# the Kotlin bindings are generated from the metadata in the built library.
[profile.android-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"

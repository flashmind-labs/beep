[workspace]
resolver = "3"
members = ["crates/proto", "crates/server", "crates/android-bridge", "crates/node", "crates/live"]

# Whole-program optimisation for the shipped binaries: beep-node, the
# server image and the iOS library. Panics still unwind: the node and server
# catch them in spawned tasks.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Size-tuned build for the Android native library. Not stripped: the Kotlin
# bindings are generated from the metadata in the built library.
[profile.android-release]
inherits = "release"
opt-level = "z"
strip = "none"

<!doctype html><html lang="en"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beep Android: the phone app</title><style>
:root{--ink:#0f1011;--surface:#151617;--elev:#1c1d1f;--border:#222326;--fg:#e3e4e6;--muted:#8a8f98;--accent:#5e6ad2;--on-accent:#fff;--hot:#f2994a;--ok:#4cb782;--err:#eb5757;--warn:#f2c94c;--dim:color-mix(in srgb,var(--muted) 62%,var(--ink));--radius:8px;--radius-sm:6px;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--body:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0a0a0b;color:var(--fg);font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased}
h1.pg{font-size:15px;font-weight:600;margin:0;padding:16px 24px 0;color:var(--muted)}
.wrap{display:flex;flex-wrap:wrap;gap:36px;padding:24px;justify-content:center}
figure{margin:0;display:grid;gap:10px;justify-items:center}
figcaption{font-size:12.5px;color:var(--muted);max-width:360px;text-align:center}
.ph{width:390px;height:800px;border-radius:44px;border:9px solid #000;background:var(--ink);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 1px #2a2b2e}
.android .ph{border-radius:30px;border-width:7px}
.sb{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:14px;font-weight:600;position:relative}
.android .sb{height:30px;padding:0 18px;font-size:12.5px;font-weight:500}
.sb .isl{position:absolute;left:50%;top:10px;width:96px;height:26px;margin-left:-48px;border-radius:14px;background:#000}
.android .sb .isl{top:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%}
.hp{flex:none;height:22px;display:grid;place-items:center}
.hp span{width:130px;height:5px;border-radius:3px;background:#e3e4e6;opacity:.8}
.android .hp{height:20px}.android .hp span{width:100px}
.cwin{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.top{flex:none;min-height:48px;display:flex;align-items:center;gap:6px;padding:4px 8px 4px 16px;border-bottom:1px solid var(--border)}
.top h2{flex:1 1 auto;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:600}
.back{width:44px;height:44px;margin:0 0 0 -10px;margin-right:-6px;display:grid;place-items:center;color:var(--muted);flex:none}
.back+h2{margin-left:0}
svg{display:block;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted);background:var(--surface)}
.pill i{display:block;width:34px;height:4px;border-radius:2px;background:var(--elev);overflow:hidden;position:relative}
.pill i::after{content:"";position:absolute;inset:0 38% 0 0;background:var(--accent)}
.tbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.view{flex:1;min-height:0;overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:14px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:var(--surface)}
.tabs div{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;min-height:52px;padding:6px 0 5px;font-size:10.5px;color:var(--muted)}
.tabs .on{color:var(--fg)}.tabs .on svg{color:var(--accent)}
.tabs .dot::after{content:"";position:absolute;top:7px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--warn)}
.mstrip{display:flex;gap:8px;margin:0 -12px;padding:0 12px;overflow:hidden}
.mstrip .m{flex:none;min-width:132px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:2px 6px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.mstrip .m b{font-size:13px;font-weight:600}
.mstrip .m span:not(.dd){grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.mstrip .m.off b{color:var(--muted)}
.mstrip .add{flex:none;display:grid;place-items:center;padding:0 14px;border:1px dashed var(--border);border-radius:var(--radius);font-size:13px;color:var(--muted)}
.dd{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.dd.off{background:var(--dim)}.dd.w{background:var(--warn)}
.ctabs{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.ctabs div{flex:1;min-height:36px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;border-radius:var(--radius-sm);white-space:nowrap;font-size:13px;color:var(--muted)}
.ctabs .on{background:var(--elev);color:var(--fg)}
.ctabs small{font-size:11px;color:var(--dim)}
.sec h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:6px}
.sec h4 span{color:var(--dim);font-weight:400}
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:46px;padding:9px 11px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row .t{min-width:0}.row .t b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:12px;color:var(--muted);white-space:nowrap}
.ag{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:700;background:var(--elev);color:var(--fg)}
.ag.c{background:#d97757;color:#fff}.ag.x{background:#e3e4e6;color:#111}.ag.g{background:#4285f4;color:#fff}
.tag{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;line-height:18px;border:1px solid var(--border)}
.tag.wait{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--border))}
.tag.run{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--border))}
.sp{display:inline-block;width:9px;height:9px;border:2px solid var(--ok);border-right-color:transparent;border-radius:50%;margin-right:5px;vertical-align:-1px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--elev);font-size:13.5px;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--dim);font-size:16px}
/* pairing */
.pair{flex:1;display:flex;flex-direction:column;gap:14px;padding:32px 24px 24px;background:var(--ink);position:relative}
.pair h1{margin:0;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.pair p{margin:0;font-size:15px;line-height:22px;color:var(--muted)}
.pair .btn{width:100%;min-height:48px;font-size:16px;font-weight:600}
.pair .code{min-height:112px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--dim);font:16px/22px var(--mono)}
.pair .code.f{color:var(--fg)}
.pair .err{color:var(--err);font-size:14px;line-height:20px}
.pair .btn.dis{opacity:.5}
.cam{position:absolute;inset:0;background:linear-gradient(160deg,#2a3340,#12161b 60%,#1d2a22);display:grid;place-items:center}
.cam .fr{width:230px;height:230px;border:2px solid #fff;border-radius:18px;opacity:.85}
.cam .bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:12px;padding:16px 24px 16px;background:var(--ink)}
.cam .bar p{text-align:center}
/* session */
.dhead{flex:none;display:flex;flex-wrap:wrap;align-items:center;row-gap:5px;column-gap:6px;padding:8px 12px 8px 4px;border-bottom:1px solid var(--border)}
.dhead .hl{flex:1 1 100%;display:flex;align-items:center;gap:4px;min-width:0}
.dhead .hl b{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .chips{display:flex;flex-wrap:wrap;gap:6px;padding-left:12px;align-items:center}
.chip{padding:0 8px;border:1px solid var(--border);border-radius:999px;font-size:11.5px;line-height:18px;white-space:nowrap;color:var(--muted)}
.st{font-size:11.5px;line-height:18px;color:var(--ok);display:inline-flex;align-items:center}
.mnav{flex:none;display:flex;gap:4px;padding:3px 10px;border-bottom:1px solid var(--border)}
.mnav div{min-height:30px;padding:0 12px;display:flex;align-items:center;border-radius:var(--radius-sm);font-size:14px;color:var(--muted)}
.mnav .on{background:var(--elev);color:var(--fg)}
.log{flex:1 1 0;min-height:0;overflow:hidden;padding:10px 12px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:21px}
.log .user{display:grid;gap:2px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--elev);font-size:13.5px;line-height:20px}
.log .user b{font-size:11.5px;font-weight:600;color:var(--muted)}
.log p{margin:0;overflow-wrap:anywhere}
.log code{font-family:var(--mono);font-size:12.5px;background:var(--elev);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.sum{display:grid;grid-template-columns:16px minmax(0,1fr) 16px;column-gap:8px;align-items:center;padding:1px 0;font-size:12.5px;line-height:20px;margin-inline:-2px}
.sum .sm{min-width:0;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum svg,.tool svg{color:var(--dim)}
.tool{display:grid;grid-template-columns:16px auto minmax(0,1fr) auto;column-gap:8px;align-items:center;font-size:12.5px;line-height:20px;margin-inline:-2px}
.tool .vb{white-space:nowrap}
.tool .cmd{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .rm{font:11px/20px var(--mono);color:var(--dim)}.tool .rm.pl{color:var(--accent)}.tool .rm.mi{color:var(--hot)}
.comp{flex:none;border-top:1px solid var(--border);background:var(--surface);padding:6px 10px 6px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.comp .fld{flex:1 1 100%;order:-1;min-height:38px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--ink);font-size:16px;line-height:20px;color:var(--dim)}
.comp.one .fld{flex:1 1 0;min-width:0}
.comp.typ .fld{color:var(--fg);min-height:58px}
.ib{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.ib.stop{border-color:var(--border);background:var(--elev);color:var(--fg)}
.ib.stop i{display:block;width:11px;height:11px;border-radius:2px;background:currentColor}
.ib.send{border-color:transparent;background:var(--accent);color:var(--on-accent)}
.ctl{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--muted)}
.ctl.plus{width:34px;justify-content:center;padding:0}
.grow{flex:1}
.caret{display:inline-block;width:2px;height:18px;background:var(--accent);vertical-align:-4px}
/* keyboards */
.kb{flex:none;background:#1b1c1e;padding:8px 4px 4px;display:grid;gap:9px}
.kb .kr{display:flex;gap:5px;justify-content:center}
.kb .k{height:40px;min-width:30px;flex:1;max-width:36px;border-radius:5px;background:#3a3b3f;display:grid;place-items:center;font-size:19px;color:#fff}
.kb .k.w{max-width:none;flex:none;width:44px;background:#2a2b2e}
.kb .k.spc{max-width:none;flex:1 1 auto;font-size:15px}
.android .kb{background:#202124}.android .kb .k{background:#303134;border-radius:8px;font-size:18px}
.android .kb .k.w{background:#3c3d41}
/* terminal */
.term{flex:1;min-height:0;background:#0b0b0c;padding:10px 12px;font:12px/18px var(--mono);color:#d0d3d8;overflow:hidden;white-space:pre}
.term .g{color:#6fcf97}.term .b{color:#8a9cf0}.term .d{color:#6b7078}
.tmkeys{flex:none;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:5px 5px 6px;background:#17181b;border-top:1px solid #26272b}
.tmkeys button,.tmkeys span{height:28px;min-width:0;padding:0;border:0;border-radius:5px;background:#26272b;color:#d0d3d8;font:11px var(--mono);display:grid;place-items:center}
.tmkeys span{background:none}
.tmkeys .on{background:var(--accent);color:var(--on-accent)}
.tl-m{margin-bottom:12px}
.tl-m h5{margin:0 0 6px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.tl-m h5 .btn{margin-left:auto;min-height:36px;font-size:12.5px}
.tl-it{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:4px;font-size:13.5px}
.tl-it span{margin-left:auto;font-size:12px;color:var(--muted)}
.tl-it code,.pj-li code{font-family:var(--mono);font-size:12px}
/* machines + projects */
.mcard{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:12px;display:grid;gap:8px}
.mcard h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.mcard h3 em{margin-left:auto;font-style:normal;font-size:12px;font-weight:400;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.meter{height:4px;border-radius:2px;background:var(--elev);overflow:hidden;margin-top:2px}.meter i{display:block;height:100%;background:var(--accent)}
.pj-li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px;padding:8px 11px;border-top:1px solid var(--border)}
.pj-li:first-child{border-top:0}
.pj-li .t b{display:block;font-size:13.5px;font-weight:500}.pj-li .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi{width:24px;height:24px;border-radius:6px;background:var(--elev);display:grid;place-items:center;color:var(--muted)}
</style></head><body class="android"><h1 class="pg">Beep Android: the phone app is the desktop app in its phone layout</h1><div class="wrap"><figure><div class="ph"><div class="sb"><span>9:41</span><span class="isl"></span><span>5G 82%</span></div><div class="cwin"><div class="pair"><h1>Pair this phone</h1><p>On a desktop, open Add machine and pick phone.</p><div class="btn pri">Scan QR code</div><div class="code">Or paste the pairing code</div><div class="btn dis">Pair</div></div></div><div class="hp"><span></span></div></div><figcaption>Pairing, before any mesh. Scan, or paste a code, then Pair.</figcaption></figure><figure><div class="ph"><div class="sb"><span>9:41</span><span class="isl"></span><span>5G 82%</span></div><div class="cwin"><div class="pair"><h1>Pair this phone</h1><p>On a desktop, open Add machine and pick phone.</p><div class="btn pri">Scan QR code</div><div class="code f">beep-join:2:k3v9q7...x2m4</div><div class="btn">Pair</div><div class="err">The code expired. Make a new one on the desktop.</div></div></div><div class="hp"><span></span></div></div><figcaption>Pairing with a pasted code that failed. Pair turns on once the field has text.</figcaption></figure><figure><div class="ph"><div class="sb"><span>9:41</span><span class="isl"></span><span>5G 82%</span></div><div class="cwin"><div class="cam"><div class="fr"></div><div class="bar"><p>Point the camera at the code</p><div class="btn">Cancel</div></div></div></div><div class="hp"><span></span></div></div><figcaption>Scanning. The camera shows through the page; only Cancel stays drawn.</figcaption></figure><figure><div class="ph"><div class="sb"><span>9:41</span><span class="isl"></span><span>5G 82%</span></div><div class="cwin"><div class="top"><h2>Home</h2><span class="pill"><i></i>62% · 3h</span></div><div class="view"><div class="mstrip"><div class="m"><span class="dd"></span><b>build-box</b><span>2 agents · 41% disk</span></div><div class="m"><span class="dd"></span><b>laptop</b><span>1 a

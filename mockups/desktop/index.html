<script>
// Prompt stashes last until this window closes.
const promptStash = [];
document.addEventListener("keydown", e => {
  const field = e.target;
  if (!(field instanceof HTMLTextAreaElement) || !field.closest(".dinput, .agc-box") || !e.ctrlKey || e.altKey || e.metaKey || e.shiftKey || e.isComposing || !["s", "p"].includes(e.key)) return;
  e.preventDefault();
  let note;
  if (e.key === "s") {
    if (!field.value.trim()) return;
    promptStash.push(field.value); field.value = ""; note = `Stashed ${promptStash.length}`;
  } else {
    const text = promptStash.pop();
    if (text === undefined) note = "Stash empty";
    else { field.value = text; note = `Popped (${promptStash.length} left)`; }
  }
  field.dispatchEvent(new Event("input", { bubbles: true }));
  document.querySelector(".prompt-stash-note")?.remove();
  const status = document.createElement("div");
  status.className = "prompt-stash-note"; status.setAttribute("role", "status"); status.textContent = note;
  Object.assign(status.style, { position: "fixed", left: "50%", bottom: "60px", transform: "translateX(-50%)", zIndex: "9999", padding: "6px 12px", borderRadius: "6px", background: "var(--d-fg)", color: "var(--d-bg)", fontSize: "12px" });
  document.body.append(status); setTimeout(() => status.remove(), 1600);
});
</script>

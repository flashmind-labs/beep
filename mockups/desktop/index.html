<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Model settings preview</title>
<style>body{background:#111;color:#ddd;font:14px system-ui;max-width:800px;margin:40px auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #333}input,select,button{background:#222;color:inherit;border:1px solid #444;padding:8px}small,p{color:#999}</style>
<h2>Models and context</h2><label>Harness <select id="harness"><option>Claude Code</option><option>Codex</option><option>Other harness</option></select></label>
<p>Default model <input placeholder="Harness default"></p><div id="models"></div>
<script>
const picker = document.querySelector('#harness');
function render() {
  const limits = picker.value === 'Codex', compact = picker.value !== 'Other harness';
  document.querySelector('#models').innerHTML = `${limits ? '<p>Limits from this machine\'s harness. Maximum usable can be smaller than the API limit.</p>' : ''}${compact ? '<p>Overrides apply to new or resumed sessions on every machine. Blank uses Auto-compact; off disables Beep\'s trigger.</p>' : ''}<input placeholder="Filter models"><table><thead><tr><th>Model</th>${limits ? '<th>Default usable</th><th>Maximum usable</th>' : ''}${compact ? '<th>Compact at</th>' : ''}</tr></thead><tbody><tr><td>Large model</td>${limits ? '<td>360,000</td><td>720,000</td>' : ''}${compact ? '<td><input placeholder="Harness setting"></td>' : ''}</tr></tbody></table>${compact ? '<p><button>Add model</button> <button>Save model overrides</button></p>' : ''}`;
}
picker.addEventListener('change', render); render();
</script></html>

<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Expired pairing code
  </title>
  <link href="../../ios/styles/shell.css" rel="stylesheet"/>
  <link href="../../ios/styles/pairing.css" rel="stylesheet"/>
  <link href="../../ios/styles/session.css" rel="stylesheet"/>
  <link href="../../ios/styles/keyboards.css" rel="stylesheet"/>
  <link href="../../ios/styles/terminal.css" rel="stylesheet"/>
  <link href="../../ios/styles/machines-projects.css" rel="stylesheet"/>
 </head>
 <body class="ios screen">
  <figure>
   <div class="ph">
    <div class="sb">
     <span>
      9:41
     </span>
     <span class="isl">
     </span>
     <span>
      5G 82%
     </span>
    </div>
    <div class="cwin">
     <div class="pair">
      <h1>
       Pair this phone
      </h1>
      <p>
       On a desktop, open Add machine and pick phone.
      </p>
      <button class="btn pri" type="button">
       Scan QR code
      </button>
      <textarea aria-label="Pairing code" autocapitalize="off" autocomplete="off" class="code f" spellcheck="false">expired-pairing-code</textarea>
      <button class="btn" type="button">
       Pair
      </button>
      <div class="err" role="alert">
       The code expired. Make a new one on the desktop.
      </div>
     </div>
    </div>
    <div class="hp">
     <span>
     </span>
    </div>
   </div>
   <figcaption>
    Pairing with a pasted code that failed. Pair turns on once the field has text.
   </figcaption>
  </figure>
 </body>
</html>

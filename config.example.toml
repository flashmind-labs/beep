# beep-server receives the apps' problem reports.

# Where the HTTP listens. Put a proxy that holds TLS in front of it.
# http_listen = "127.0.0.1:47122"
# Where the daily log files go.
# log_dir = "logs"

[reports]
# A local folder, for development. `r2` wins when both are set.
folder = ".dev/reports"
# Reports one key may send per day.
# per_key_per_day = 20
# blocked_keys = []
# blocked_ips = []

# [reports.r2]
# account_id = "YOUR-ACCOUNT-ID"
# bucket = "beep-reports"
# access_key_id = "YOUR-KEY-ID"
# secret_access_key = "YOUR-SECRET"
